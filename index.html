var EMBEDDED_CHAPTERS=[{"no":1,"title":"实现安全治理的原则和策略","secs":[{"sec":"1.1 安全 ","body":["安全的重要性经常被提及,但我们并非总能理解其中的缘由。安全很重要,是因为当有 人试图窃取组织的数据或破坏其物理或逻辑元素时,它有助千确保组织继续存在与运营。安 全应被视为业务管理的一个要素,而不仅是 IT 问题。事实上, IT 和安全是不同的。信息技 (IT) 或信息系统(IS) 是支持业务操作或功能的硬件和软件。","安全是一种业务管理工具,旨在 确保 IT/IS 的运行可靠且受到保护。安全的存在是为了支持组织的目标、使命和宗旨。 通常,应该采用安全框架来为安全的实现提供一个起点。启动安全后,则通过评估来微 调安全。有三种常见的安全评估类型:风险评估、漏洞评估和渗透测试(详见第 章和第 <sup>15</sup> 章)。","风险评估是识别资产、威胁和漏洞,然后使用这些信息来计算风险的过程。一旦了解了 风险,就可利用它来指导现有安全基础设施的改进。漏洞评估使用自动化工具来定位已知的 安全弱点,这些弱点可通过添加防御措施或调整现有保护措施来解决。渗透测试利用可信的 个人对安全基础设施进行压力测试,以找出前两种方法可能发现不 的问题,其目标是在对 手利用这些问题之前找到它们。","安全应具有成本效益。组织的预算不是无限的,因此必须适当地分配资金。此外,组织 预算不仅要包括员工工资、保险、退休金等的费用,还应包括用于安全的一定比例的资金, 就像大多数其他业务任务和流程需要资金一样。应该选择以最低资源成本提供最大保护的安 全控制。 安全应该是合法的。你所在辖区的法律是组织安全的后盾。"]},{"sec":"1.2 理解和应用安全概念","body":["安全管理的概念与原则是实施安全策略和安全解决方案的核心内容。安全管理的概念与 原则定义了安全环境中必需的基本参数,也定义了安全策略设计人员和系统实施人员为创建 安全解决方案必须实现的目标。 保密性、完整性和可用性(confidentiality, integrity, and availability, CIA 三元组)经常被视 为安全基础架构中主要的安全目标和宗旨(见图 1.1) ![](_page_54_Figure_1.jpeg) 1.1 CIA 二元组 安全控制评估通常用千评价这三个核心信息安全原则的符合清况。","对脆弱性和风险的评 估也基千它们对一个或多个 CIA 三元组原则的威胁。 #### 1.2.1 保密性 CIA 三元组的第 个原则是保密性。保密性指为保障数据、客体或资源保密状态而采取 的措施。保密性保护的目标是阻止或最小化未经授权的数据访问。保密性在保护授权访问的 同时防止泄露 违反保密性的行为不仅包括直接的故意攻击,也包括许多由人为错误、疏忽或不称职造 成的未经授权的敏感或机密信息泄露。","违反保密性可能是因为最终用户或系统管理员的不当 行为,也可能是因为安全策略中的疏漏或配置有误的安全控制。 许多控制措施有利千保障保密性以抵御潜在的威胁。这些控制措施包括加密、填充网络 流量、严格的访问控制、严格的身份认证程序、数据分类和充分的人员培训。 保密性的相关概念、条件和特征包括: 敏感性 敏感性指信息的特性,这种特性的数据一旦泄露就会导致伤害或损失。","判断力 判断力是一种决策行为一—操作者可影响或控制信息泄露,以将伤害或损失程 度降至最低。 关键性信息的关键程度是其关键性的衡量标准。关键级别越高,越需要保持信息的保 密性。 隐藏 隐藏(concealment) 指藏匿或防止泄露的行为。通常,隐藏被看成一种掩盖、混淆 和干扰注意力的手段。与隐藏相关的一个概念是通过晦涩获得安全,即试图通过隐藏、沉默 或保密来获得保护。"]},{"sec":"1.3 安全边界","body":["安全边界是具有不同安全要求或需求的任意两个区域、子网或环境之间的交界线 安全 边界存在千高安全区域和低安全区域之间,例如局域网和互联网之间。重要的是识别网络和 物理世界中的安全边界。一旦确定了安全边界,就必须部署机制来控制跨该安全边界的信息流。 安全区域之间的划分可以采取多种形式。例如,对象可能有不同的分类。","每个分类都定 义了哪些主体可以对哪些客体执行哪些功能。不同的分类之间就是安全边界。 物理环境和逻辑环境之间也存在安全边界。要提供逻辑安全,就必须提供不同千那些用 千提供物理安全的安全机制。物理安全和逻辑安全都必须存在,以提供完整的安全结构,并 且两者都必须在安全策略中得到体现。当然,物理安全和逻辑安全是不同的,必须作为安全 解决方案的不同元素进行评估。","应始终明确定义安令边界,例如受保护区域和未受保护区域之间的边界。重要的是在安 全策略中明确安全控制的终点或起点,并在物理环境和逻辑环境中确定该位置。逻辑安全边 界是组织在法律上负有责任的设备或服务的电子通信接口点。大多数情况下,该接口被明确 标记,并告知未授权的主体无权访问。如试图获得访问,将导致起诉。","物理环境中的安全边界通常与逻辑环境的安全边界相对应。大多数情况下,组织在法律 上负责的区域决定了安全策略在物理领域的范围。这些可以是办公室的围墙、建筑物的围墙 或校园周围的围栏。在安全环境中,张贴警告标志,表明禁止未经授权的访问,试图进入者 将受到阻止,并导致起诉。 将安全策略转化为实际控制时,必须分别考虑每个环境和安全边界。"]},{"sec":"1.4 评估和应用安全治理原则","body":["安全治理是与支持、评估、定义和指导组织安全工作相关的实践集合。 最理想的情况是,安全治理由董事会执行,但在规模较小的组织,可仅由甘席执行官(CEO) 或首席信息安全官(CISO)执行安全治理活动。安全治理旨在将组织内所使用的安全流程和基 础设施与从外部来源获得的知识和见解进行比对。因此,董事会通常由来自不同背景和行业 的人构成。","董事会成员可以使用他们丰富的经验和智慧为其监督的组织提供改进指导。 安全治理原则通常与公司和 IT 治理密切相关。这三类治理的工作目标一般是相同的或相 互关联的,例如持续存在并努力实现增长和韧性。 组织迫千法律和法规的要求必须实施治理,也必须遵守行业指南或许可证要求。所有形 式的治理(包括安全治理)都应不时进行评估和验证。","由千政府法规或行业最佳实践,可能存 在各种审计和验证要求。当不同国家的法律不-致或实际上存在冲突时,这个难题更难解决。 组织作为一个整体应该具备方向、指导和工具,以提供有效的监督和管理能力,解决威胁和 风险;重点是缩短停机时间,并将潜在的损失或损害降至最低。 正如你看到的,安全治理通常是较严格和高层次的内容。","最终,安全治理指实施安全解 决方案以及与之紧密关联的管理方法。安全治理直接监督并涉及所有级别的安全。安全不完 全是 IT 事务,也不应该仅被视为 IT 事务。相反,安全会影响组织的方方面面。安全是业务 运营事务,是组织流程而不仅是 IT 极客在后台实施的事情。这里使用术语\"安全治理\"指 出安全需要在整个组织中进行管理和治理,而不只是在 IT 部门,就是为了强调这一点。"]}]},{"no":2,"title":"人员安全和风险管理的概念","secs":[{"sec":"2.1 人员安全策略和程序","body":["在听有安全解决方案中,人员经常被视为最脆弱的元素。无论部署了什么物理或逻辑控 制措施,人总是可以找到方法来规避、绕过控制措施,或使控制措施失效。因此,为环境设 寸和部署安全解决方案时,有必要考虑人性。为理解和应用安全治理,必须应对安全链中最 薄弱的环节,即人员安全。 不过,当人员受到适当的培训,并被激励去保护自己和组织的安全时,他们也可以成为 关键的安全资产。","重要的是,不要把人员视为一个需要解决的安全问题,而是把他们当作安 全工作中有价值的合作伙伴。 与人员相关的事件、问题和损害可能发生在制订安全解决方案的所有阶段。这是因为任 呵解决方案的开发、部署和持续管理郘与人员相关。因此,必须评估用户、设计人员、程序 员、开发人员、管理人员、供应商、咨询顾问和实施人员对过程的影响。","#### 2.1.1 岗位描述与职责 招聘新员上的过程通常包括几个不同步骤:创建岗位描述或职位描述,设置工作级别, 筛选应聘者,招聘和培训最适合该岗位的人。如果没有岗位描述,就不能对应该招聘哪类人 员达成共识 组织内任何职位的岗位描述都应该考虑相关的安全问题,例如,必须考虑职位是否需要 处理敏感材料或访问机密信息等事项。","实际上,岗位描述定义了需要分配给员丁的角色,以 便其执行工作任务。角色通常与特权等级或者级别相一致,而岗位描述与具体分配的职责和 任务相对应。 岗位职责Gob responsibilities)指员工常规执行的具体工作任务。根据员工的职责,他们需 要访问各种对象、资源和服务。因此,岗位职责膺单为访问权阳、许可和特权的分配提烘指 导。"]},{"sec":"2.2 理解并应用风险管理概念","body":["风险管理是一个详细的过程,包括识别可能造成资产损坏或泄露的因素,根据资产价值 和控制措施的成本评估这些因素,并实施具有成本效益的解决方案来减轻风险。风险管理的 整体过程用千制订和实施信息安全策略,这些策略旨在支待组织使命。首次执行风险管理的 结果是制订安全策略的依据。随着内部和外部条件的变化,后续的风险管理事件用千改进和 维持组织的安全基础设施。","风险管理的主要目标是粘风险降至可接受的水平。这个水平实际卜取决千组织、资产价 值、预算的高低以及其他许多因素。某个组织认为可接受的风险对另一个组织来说可能是无 法接受的高风险。虽烘不太可能没计和实施一个完全没有风险的环境,但通过适当努力通常 可显著降低风险。 IT 基础设施面临的风险不只源千计算机方面。","事实上,许多风险来自非 IT 来源。对组 织进行风险评估时.有必要考虑所有可能的风险,包括事故、自然灾害、金融威胁、内乱、 流行病、物理威胁、技术利用和社会工程等。如果不能正确评估和响应所有形式的风险,公 司就容易受到攻击。 风险管理是由风险评估和风险响应这两个基本要素组成的。 风险评估或风险分析是指检查环境中的风险,评估每个威胁事件发生的可能性和实际发 生后造成的损失,并评估各和风险控制措施的成本。","这个结果可用于对风险优先级的关键级 别进行排序。在此之后,就可以开始进行风险响应。 风险响应包括使用成本/收益分析的方式评估风险控制措施、防护措施和安全控制,根据 其他条件、关注事项、优先事项和资源调整评估结果,并在向高级管理层汇报的报告中给出 建议的响应方案。根据管理决策和指导,将所选择的响应措施部署到 IT 基础设施中,并在安 全策略文档中进行说明。"]},{"sec":"2.3 社会工程","body":["社会工程是一种利用人类天性和人类行为的攻击形式。人员是安全方面的薄弱环节,因 为他们可能会犯错误,会被愚弄而造成损害或故意违反公司安全。社会工程攻击利用的是人 类的特性,例如对他人的基本信任、提供帮助的愿望或炫耀的倾向。必须考虑人员给组织带 来的风险并实施安全策略以最小化这些风险并处理这些风险。 社会工程攻击有两种主要形式:说服某人执行未经授权的操作或说服某人泄露机密信息。","在几乎所有情况下,在社会工程中,攻击者都会试图说服受害者执行某些活动或泄露他们不 应该泄露的信息。成功攻击的结果是信息泄露或攻击者被授予对安全环境的逻辑或物理访问 权限。 以下是一些常见的社会工程攻击的示例场景。 - ·一个网站声称允许对其产品和服务进行免费的临时访问,但需要更改 Web 浏览器和 或防火墙才能下载访问软件。","这些更改可能会降低安全保护或鼓励受害者安装恶意浏 览器辅助对象(BHO)(也称为插件、扩展、附加组件)。 - .服务台接到一个自称是部门经理的人员来电,该人目前正在另一个城市参加销售会 议。来电者声称忘记了密码,需要重置密码,以便其远程登录以下载重要的演示文稿。 - ·一个看起来像维修技术人员的人声称收到了关千建筑物中出现设备故障的服务电话。","\"维修技术人员\"确信可以从你的办公室工作区域内访问该设备,并要求获得维修系 统的访问权限。 - ·如果员工收到一个来电,来电者要求与某个被指定姓名的同事进行交谈,而目前或以 前没有此人在组织工作,那这可能是一个诡计。因为来电者的信息不正确,所以要么 让你透露实际员工的姓名,要么说服你\"提供帮助\"。 - ·当论坛上的联系人提出个人问题(例如你的教育、经历和兴趣)时,他们可能正专注于 了解密码重置问题的答案。"]},{"sec":"2.3  身份欺诈","body":["身份欺诈(identity fraud) 和身份盗窃是经常互换使用的术语。事实上,美国司法部(DoJ) 表示\"身份盗窃和身份欺诈指的是所有类型的以欺诈或欺骗的方式非法获取和使用他人的 个人数据的犯罪,通常是为了获得经济利益\"。身份欺诈和身份盗窃既可以是社会工程攻击 的目的(即窃取 PII) ,也可以是用于促成社会工程攻击的工具。","然而,务必认识到虽然我们可朼这些术语用作同义词(特别是在随意的交谈中),但通 过了解它们的不同之处,可以获得更多价值。 身份盗窃是窃取某人身份的行为。具体而言,可以指攻击者最开始进行的信息收集或诱 骗行为,包括以盗窃或者以其他方式获取用户名、电子邮件、密码、秘密问题的答案、信用 卡号、社会保险号、医疗保健服务号以及其他朼关的和有关联的事件信息。","因此,身份盗窃 的第一个定义是实际盗窃某入的账户或财务状况的凭证和信息。 身份盗窃的第二个定义是那些被盗的凭证和详细信息被用来接管某人的账户。这可能包 括在某一在线服务上登录其账户;对其信用卡、 ATM 卡或借记卡进行虚假收费;对其支票账 户开出脂假支票;或使用受害者的社会安全号码以受害者的名义开设新的信用额度。","当攻击 者窃取并使用受害者的凭证时,这被称为凭证劫持。 身份盗窃的第二个定义也与身份欺诈的定义非常相似。欺诈是指将虚假的东西称作真实 的。身份欺诈是指通过使用从受害者那里窃取的信息,虚假地声称自己是他人。身份欺诈是 为了个人或经济利益而进行的违法假冒或故意欺骗。身份欺诈的例子包括以他人的社会保险 号码就业,以他人的名义开通电话服务或公用设施,或使用他人的健康保险获得医疗服务。"]}]},{"no":3,"title":"业务连续性计划","secs":[{"sec":"3.1 业务连续性计划概述","body":["业务连续性计划涉及评估组织流程的风险,以及创建策略、计划和程序,以最大限度地 减小这些风险发生时对组织产生的不良影响。 BCP 用于在紧急情况下维持业务的连续运营。 BCP 计划者的目标是通过综合实施策略、程序和流程,将潜在的破坏性事件对业务的影响 降至最小。 BCP 专注千在降低的或受限的基础设施能力或资源上维持业务运营。","只要能维持组织连 续执行关键工作任务的能力,就可以利用 BCP 管理和恢复生产环境。 #### 业务连续性计划与灾难恢复计划 CISSP 考生常对业务连续性计划(BCP)和灾难恢复计划(disaster recovery planning, DRP) 之间的差异感到困惑,可能尝试对二者进行排序,或划出一者之间的界限。","真实情况是,这 些界限在现实中是模糊的,不应把它们分为完全不同的类别。 二者之间的区别在千视角。这两项活动都旨在帮助组织应对灾难,目标是在可能的清况 下使业务持续运行,并在中断后尽快恢复运营。齐见角差开在于:业务连续性计划通常战略性 地关注上层,以业务流程和运营为中心;灾难恢复计划本质上更具战术性,描述恢复站点、 备份和容错等技术活动。","无论如何,不要纠结千二者之间的差异。我们还没有看到哪个考题迫使人们严格区别这 两项活动。更重要的是理解这两个相关领域涉及的流程和技术。 你将在第 <sup>18</sup> 章中了解关千灾难恢复计划的更多内容。 BCP 的总体目标是在紧急情况下提供快速、冷静和有效的响应,提高公司从破坏性事件 中快速恢复的能力。"]},{"sec":"3.2 项目范围和计划","body":["与任何正式的业务流程一样,制订具有恢复能力的\\Iv. 务连续性计划时需要使用成熟的方 法。组织在规划过程中应牢记以下目标: - ·从危机规划的角度对业务组织进行结构化分析。 - ·在高级管理层的批准下创建 BCP 团队。 - .评估可用于业务连续性活动的资源。 - ·分析在处理灾难性事件方面,组织需要遵守的法律以及所处的监管环境。","具体流程取决千组织及其业务的规模和性质。业务连续性计划没有\"放之四海而皆准\" 的指南。你应咨询组织内的项目规划专业人员,并根据组织文化确定最有效的方法。 此阶段的目的是确保组织投入足够的时间和精力来制订项目范围和计划,并对这些活动 进行记录以供将来参考。 ### 3.2.1 组织分析 负责业务连续性计划的人员的首要职责之一是对业务组织进行分析,以识别与 BCP 流程 具有利害关系的所有部门和个人。","需要考虑的范围如下: - ·负责向客户提供核心服务业务的运营部门。 - ·关键支持服务部门,如 IT 部门、设施和维护人员以及负责维护支持运营部门系统的 其他闭队。 - ·负贞物理安全的公1-1j 安全团队。他们在多数情况下是安全事故的第一响应者,也负责 主要基础设施和备用处理设施的物理保护。 - ·高级管理人员和对组织持续运营来说至关重要的其他人员。","出千以下两个原因,这个识别过程非常重要。首先,它完成了确定 BCP 团队潜在成员 所需的基础上作(见下一节)。其次,为在 BCP 过程中开展其他工作打下了基础。 通常,业务组织分析由负责 BCP 工作的人员执行。有些组织会聘请专职的业务连续性经 理来管理这些工作,而有些组织则会让一位 IT 管理者来兼任该职责。"]},{"sec":"3.3 业务影晌分析","body":["一旦 BCP 团队完成准备创建业务连续性计划的四个阶段,就进入工作的核心部分:业务 影响分析(business impact analysis, BIA) BIA 确定对组织持续运营能力而言非常关键的业务 流程和任务以及这些资源面临的威胁,并评估每个威胁发生的可能性以及威胁事件对业务的 影响。 BIA 结果提供了度呈措施,可对用千因解决组织面临的各种本地、区域及全球风险而 投入的业务连续性资源进行优先级排序。","业务计划者在进行决策时,必须意识到需要使用以下两种不同类型的分析方法。 定量影响评估 涉及使用数字和公式得出结论的过程。这类数据结果通常用货币价值表 示与业务相关的选项。 定性影响评估考虑非数字因素,如声誉、投资者/客户信心、员工稳定性和其他相关事 项。这类数据结果通常用优先级别(如高、中、低)表示。","`亡 过程中,定量评估和定性评估都扮演着关键角色。然而,很多人倾向于只 歹王已 使用其中一种分析方法。在选择 BCP 团队成员时,应努力在倾向不同策略的人员 之间取得平衡。这个方法有助于制订出完善的 BCP, 并让组织长期受益。 本章分别从定最和定性的角度阐述 BIA 过程。不过, BCP 团队更倾向千使用数字进行定 量评估,而忽略更主观的定性评估结果。","BCP 团队应对影响 BCP 过程的因素进行定性分析。 例如,如果业务高度依赖千少数几个重要客户,那么管理团队可能愿意承担较大的短期财务 损失以长久地留住这些客户。 BCP 团队(最好有高级管理层的参与)必须一起仔细进行定性分 析,以找出满足所有利益相关方的综合解决方法。 `)::;步了解 BIA 流程,你将发现它与笫 章中介绍的风险评估流程非常相似。"]},{"sec":"3.4 连续性计划","body":["BCP 流程的前两个阶段(项目范围和计划以及业务影响分析)重点确定 BCP 流程将如何运 行,并对必须保护以防止中断的业务资产进彴优先级排序。 BCP 开发的下 个阶段是编制连 续性计划,重点是开发和实施连续性战略,尽量减少已发生的风险对被保护资产的影响。 连续性计划包括两个主要的子任务: ·预备和处理 在本节中,你将学习对连续性计划来说至关重要的策略开发以及预备和处理。","这个过程的目标是创建连续性运营计戈 (COOP) 。连续性运营计划关注的是组织如何才能 在中断发生不久后就开始执行关键业务功能,并维持长达一个月的持续运营。 ### 3.4.1 策略开发 策略开发阶段在业务影响分析与 BCP 开发的连续性计划阶段之间架起桥梁。 BCP 团队 现在必须采用由定量和定性资源优先排序工作提出的优先级问题清单,确定业务连续性计划 将处理哪些风险。","要完全解决所有意外事件,就需要实施在而临所有可能的风险时保持零故 障时间的预备和处理。出千显而易见的原因,根本不可能实施这样一个综合策略。 BCP 团队应回顾在 BIA 早期阶段创建的 M1D 估值,并确定哪些风险是可接受的,以及哪 些风险必须通过 BCP 连续性措施予以缓解。有些决定是显而易见的,如暴风雪袭击埃及运营设施 的风险可被视为可接受风险,可以忽略不计;而新德里雨季的风险非常大,必须通过 BCP 措施予 以减轻。","一旦 BCP 团队确定哪些风险需要缓解以及将为每个缓解任务提供的资源水平,他们就准 备进入连续性汁划的\"预备和处理\"阶段。 ### 3.4.2 预备和处理 连续性计划的预备和处理阶段是整个业务连续性计划的关键部分。在这个任务中, BCP 团队设计具体的流程和机制来减轻在策略开发阶段被认为不可接受的风险。"]}]},{"no":4,"title":"法律、法规和合规","secs":[{"sec":"4.1 法律的分类","body":["美国的法律系统中有三种主要的法律类型。每种法律都被用来应对各种不同情况,在不 同类别的法律下,对违法行为的处罚差别也很大。下而将分析刑丛、民法和行政法如何相互 作用以形成司法系统的复杂网络。 #### 4.1.1 刑法 刑法是维护和平、保障社会安全的法律体系的某石。许多引人汴目的法庭案件涉及刑法 问题,刑法也是警察和其他执法机构关注的法律。","开心上包含针对某些行为(如谋杀、袭击、抢 劫和纵火等)的禁令。对违反刑法行为的处罚是有范围的,包括强制时长的社区服务、货币形 式的罚款以及以监禁形式对公民自由的剥夺。 ### 画真实场景 #### 不要低估技术犯罪调查员! 本书一位作者的好友是当地警察局的技术犯罪调查员。他经常接手涉及威胁邮件和网站 帖子的计算机滥用案件。","最近,他分享[一起通过电子邮件向当地一所高中发送炸弹威肋的案件。罪犯给校长发 了一封威胁邮件,宣称炸弹将在下午 点爆炸,并警告他撤离学校。作者的好友在上午 <sup>11</sup> 点收到报警,此时他只有两个小时的时间来调查犯罪行为并向校长提出最佳应对建议。 他立刻向互联网服务提供商发出紧急传票,并追踪到威胁邮件来自学校图书馆的一台计 算机。","中午 12: 15, 他向嫌疑人出示了监控录像和审计记录,监控录像显示嫌疑人正在操作 图书馆计算机,审计记录证实了嫌疑人发送过该邮件。这名学生很快承认其发这种威胁邮件 只是为了让学校提前几个小时放学。他的解释是:\"我认为没人能发现真相。\" 事实表明,这名学生的想法是错误的。 许多刑法通过打击计算机犯罪来保护社会安全。"]},{"sec":"4.2 法律","body":["下面将研究一些与信息技术相关的法律。我们将研究一些美国法律,还将简要介绍几个 广受关注的非美国法律,例如欧盟的《通用数据保护条例》 (GDPR) 。然而,如果运营环境涉 及外国的司法管辖权,则应聘请当地的法律顾问来指导你了解他们的法律系统。 ` 警告: 每个信息安全专业人员都应对与信息技术相关的法律有基本了解。","不过,最重要 的教训是知道什么时候旦该请律师。如果你认为自己正处于法律的\"灰色地带\", 最好寻求专业建议。 ### 4.2.1 计算机犯罪 立法者判定的第一批汁算机安全案件是那些涉及计算机犯罪的事件。根据传统刑法,早 期的许多计算机犯罪起诉案件都被驳回,因为法官认为将传统法律应用到这种现代类型的犯 罪的做法太过牵强。","为此,立法者通过了专门法规,在其中定义了计算机犯罪,并对各种犯 罪制定了具体的惩罚措施。接下来将介绍其中一些法规。 提示: ` 本章讨论的美国法律都是联邦法律。但要记住,在美国,几乎每个州都针对计算 机安全问题制定了某些形式的法律。由于互联网覆盖全球,大多数计算机犯罪都 跨越了州的边界,因此被归入联邦司法管辖范围并在联邦法院系统中进行诉讼。","然而,某些情况下,扒法律可能比联邦法律更严格,处罚也更严厉。 #### 1. 《计算机欺诈和滥用法案》 《计算机欺诈和滥用法案》 (CFAA)是美国针对网络犯罪的第一项重要立法。美国国会早 <sup>1984</sup> 年就颁布了这个与计算机犯罪相关的法律,并将其作为《全面控制犯罪法》 (CCCA) 的一部分。"]},{"sec":"6.2014 年的联邦网络安全法案","body":["<sup>2014</sup> 年,美国总统签署了一系死法案,使联邦政府处理网络安全问题的方法与时俱进。 第一个是令人费解的《联邦信息系统现代化法案》(也被缩写为 FISMA) <sup>2014</sup> 年的 FISMA 修改了 <sup>2002</sup> 年发布的 FISMA 的规则,将联邦网络安全责任集中到美国国土安全部。","不过有 两个例外情况:与国防相关的网络安全问题仍由美国国防部负责,而美国国家情报机构负责 与情报相关的问题。 其次,美国国会通过了《网络安全增强法案》,该法案要求 NIST 负责协调全国范围内的 自发网络安全标准工作。 NIST 为联邦政府编制[与计算机安全相关的 <sup>800</sup> 系列特别出版物。","这些出版物对所有安全从业人员都很有用,可在 NIST 官网上免费获得。 以下是 NIST 的常用标准。 - NIST SP 800-53: 联邦信息系统和组织的安全和隐私控制。该标准适用千联邦计算系 统也常被用作行业网络安全基准。 - NIST SP 800-171 :保护非联邦信息系统和组织中受控的非分类信息。","遵守该标准的 安全控制(与 NIST SP 800-53 的安全控制非常相似)经常被列入政府机构的合同要求。 联邦承包商通常必须遵守 NIST SP 800-171 - NIST 网络安全框架(CSF) 。这套标准旨在充当自发的基千风险的框架,用千保护信 息和系统。 与这一波新要求相关的第三部法律是《国家网络安全保护法》。"]},{"sec":"4.3 合规","body":["近十年来,信息安全监管环境日趋复杂。组织可能发现自己受制千各种法律(其中许多法 律在本章前面提到过)和由监管机构或合同义务强制实施的规定。 ### 画真实场景 支付卡行业数据安全标准 支付卡行业数据安全标准(PCI DSS) 是合规要求的一个好例子,它是由合同义务(而不是 法律)规定的。 PCIDSS 管理信用卡信息的安全性,通过接受信用卡的企业与处理业务交易的 银行之间的商业协议条款来强制执行。","PCIDSS <sup>12</sup> 个主要要求: - 安装和维护防火墙配置以保护持卡人数据。 - . 不要使用由供应商提供的默认系统密码和其他默认安全参数。 - 保护存储的持卡人数据。 - . 在开放的公共网络加密传输持卡人数据。 - . 使所有系统免受恶意软件攻击并定期更新杀毒软件或程序。 - 开发和维护安全的系统和应用程序。","- 基千业务的因需可知原则,限制对持卡人数据的访问。 - 识别和验证对系统组件的访问。 - 限制对持卡人数据的物理访问。 - . 跟踪和监控对网络资混和持卡人数据的所有访问。 - 定期测试安全系统和流程。 - 维护针对所有人员的信息安全的策略。 所有这些要求在完整的 PCI DSS 标准中均有详细说明,该标准可在其官网上找到。","PCIDSS 约束的组织可能需要进行年度合规性评估,具体取决于他们处理的交易数量及其 网络安全违规历史。 组织在处理许多相互重叠的(甚至相互矛盾的)合规需求时,需要认真规划。许多组织聘 用全职 IT 合规人员,让他们负责跟踪监管环境,监视控制以确保持续合规,促进合规审计, 并履行组织的合规报告责任。"]}]},{"no":5,"title":"保护资产安全","secs":[{"sec":"5.1 对信息和资产进行识别和分类","body":["数据安全生命周期管理是指数据保护始于数据被首次创建时,一直持续到该数据被销 毁时。 实现生命周期保护的第一步是对信息和资产进行识别和分类。组织常将分类定义纳入安 全策略中。然后,人员根据安全策略要求适当地标记资产。这里所述的资产包括敏感数据、 用千处理它们的硬件和用千保存它们的介质。 #### 5.1.1 定义敏感数据 敏感数据不是公开的数据,也不是未分类的数据,它包括机密的、专有的、受保护的或 因其对组织的价值或按照现有的法律和法规而需要组织保护的任何其他类型的数据。","#### 1. 个人身份信息 个人身份信息(personally identifiable information, PII) 是任何可以识别个人的信息。美国 NIST SP 800-122 提供了如下更正式的定义。 PII 是由机构保存的关千个人的任何信息,包括: (1) 任何可用于识别或追踪个人身份的信息,如姓名、社会保险账号、出生日期、出生 地点、母亲的娘家姓或生物识别记录。","(2) 与个人有关联或有指向性的其他信息,如医疗、教育、财务和就业信息。 最重要的是,组织有责任保护 PII, 包括与员工和客户相关的 PII 。许多法律要求,当数 据泄露导致 PII 丢失时,组织要通知个人。 ` 提示: 对个人身份信息(PIT) 的保护推动了全世界(特别是北美和欧盟)对规则、法规和立法 的隐私和保密要求。","NIST SP 800-122\" 个人身份信息保密指南\"提供了关于如何 保护 PII 的更多信息,可从 NIST 的特别出版物(800 系列)下栽页面获得。 #### 2. 受保护的健康信息 受保护的健康信息(protected health information, PHI)是与特定个人有关的任何健康信息。"]},{"sec":"5.2 建立信息和资产的处理要求","body":["管理敏感数据的一个关键目标就是阻止数据泄露。数据泄露是指未经授权的实体查阅和 访问敏感数据的一种事件。如果你留意这方面新闻,就会知道数据泄露事件经常发生。 <sup>2020</sup> 年万豪数据泄露等大型数据泄霹事件成为主流新闻。万豪报告称,攻击者窃取了大约 <sup>520</sup> 客人的个人数据,包括姓名、地址、电子邮件地址、雇主信息和电话号码。","不过,或许你从未听说过较小的数据泄露事件,但实际上这类事件是经常发生的。 ITRC 报告了 <sup>540</sup> 起数据泄露事件,在 <sup>2020</sup> 年上半年影响了超过 1.63 亿人。这相当千每周平均报 <sup>20</sup> 起数据泄露事件。下面是组织内人员应遵循的基本步骤,以限制数据泄露的可能性。","### 5.2.1 数据维护 数据维护是指在数据的整个生命周期中不断地组织和维护数据。一般来说,如果一个组 织将所有敏感数据存储在一台服务器上,那么相对容易的做法是将所有适当的控制都应用到 这台服务器上。相反,如果敏感数据存储在整个组织中的多台哏务器和最终用户计算机上, 并与非敏感数据混合在一起,那么它会变得更难以保护。","一个网络只处理未分类的数据。另一个网络处理分类数据。物理隔离之类的技术可确保 两个网络永远不会在物理上相互接触。物理隔离是—种物理安全控制,意味着来自分类网络 的系统和电缆在物理上永远不会接触来自未分类网络的系统和电缆。此外,分类网络无法访 问互联网,互联网攻击者也无法访问。 尽管如此,有些时候,例如设备、系统和应用程序需要更新时,人员需要向分类网络添 加数据。"]},{"sec":"5.3 数据保护方法","body":["保护数据保密性的主要方法之一是加密,如本章前面\"理解数据状态\"部分所述。 DLP 方法有助于防止数据从网络或计算机系统中泄露出去。本节介绍一些其他的数据保护方法。 ### 5.3.1 数字版权管理 数字版权管理(digital right management, DRM)方法试图为受版权保护的作品提供版权保 护。","其目的是防止未经授权使用、修改和分发知识产权等受版权保护的作品的行为。以下是 DRM 解决方案和关的 些方法。 DRM 许可证 许可]]授予对产品的访问权阳并足义使用条款。 DRM 许可证通常是一个 小文件,其中包含使用条款以及用于解锁对产品访问的解密密钥。 持久在线认证 持久在线认证(也被称为永远在线 DRM)要求系统连接到互联网后才能 使用广品。","系统会定期与认证服务器连接,如果迕接或认证失败, DRM 将会拒绝对该产品 的使用。 持续审计跟踪 持续审计跟踪记录所有对受版权保护的产品的使用。当与持久在线认证 结合在一起时,它还可以检测滥用行为,例如在两个不同的地理位置上同时使用一种产品的 行为。 自动过期许多产品都是以订闭的月式进行出售的。例如,你可以经常租用新的流媒体 电影,但这些电影只能在有限的时间内使用,例如 <sup>30</sup> 天。","当订阅期结束时,自动到期功能会 阻止任何进一步的访问。 举个例子,设想一下,你梦到一个绝妙的书籍创意。你醒来后兴致勃勃地写下所记得的 一切。在接下来的一年里,你把所有的空闲时间都花在了发展这个创意上,并最终出版了该 书籍。 为了方便某些人阅读你的著作,你提供了该书的可移植文档格式(PDF)版本。你很高兴看 到它在畅销书排行榜卜飘升。"]},{"sec":"5.4 理骡数据角色","body":["组织内的许多人管理、处理和使用数据,不同角色有不同的需求。不同文档资料对这些 角色的定义略有不同。你可能看到一些术语与 NIST 文档中使用的专业术语相匹配,而其他 术语与欧盟(EU) 《通用数据保护条例》 (GDPR) 中使用的一些专业术语相匹配。在适当的时候, 我们列出来源,以便你根据需要深入研究这些术语。","这里最重要的概念之一是确保员工知道谁拥有信息和资产。所有者对数据和资产的保护 负有主要责任。 #### 5.4.1 ~据所有者 数据所有者(data owner)(有时被称为组织所有者或高管)是对数据负有最终组织责任的 人。所有者通常是首席运营官(CEO) 、总裁或部门主管(DH) 数据所有者识别数据的分类并确保它被正确地标记。","他们还确保它在分类和组织的安 全策略要求的基础上有足够的安全控制。所有者如未能在制订和执行安全策略时在保护和维 持敏感资料方面进行尽职审查,则可能需要对其疏忽负责。 NIST SP 800-18 Rev.I\" 联邦信息系统安全计划开发指南\"概述了信息所有者(其实与数据 所有者相同)的以下职责。 - .建立适当使用和保护主体数据/信息的规则(行为规则)。","- . 向信息系统所有者提供有关信息所在系统的安全要求和安全控制的输入。 - ·决定谁可以访问信息系统,及其具备哪些类型的特权或访问权限。 - ·协助识别和评估信息驻留环境的通用安全控制。 ![](_page_206_Picture_14.jpeg) « :::SP800-18 常使用短语\"行为规则\",这实际上与可接受的使用策的acceptable §§ll usepolicy, AUP湘同。"]}]},{"no":6,"title":"密码学和对称密钥算法","secs":[{"sec":"6.1 密码学基本知识","body":["对任何一门学科的学习都必须从讨沦构建该学科的基本原则入手。以下各节将介绍密码 学的目标,概述密码技术的基本概念并讲解密码系统所用的主要数学原理,从而打下这个基 础。 ### 6.1.1 密码学的目标 安全从业者可借助密码系统实现 个基本目标:保密性、完整性、身份认证和不可否认 性。其中每个目标的实现都需要满足诸多设计要求,而且并非所有密码系统都是为达到所有 个目标而设计的。","下面的小节将详细讲解这 个目标并简要描述实现目标所必须满足的技 术条件。 #### 1. 保密性 保密性(confidentiality)确保数据在静态、传输中和使用中等三种不同状态下始终保持私密。 保密性是指为存储的信息或个人和群体之间的通信保守秘密,它或许是被提得最多的一 个密码系统目标。有两大类密码系统专用千实现保密性。","- .对称密码系统(symmetric cryptosystem) ,使用一个共享秘密密钥,提供给密码系统 的所有用户。 - ·非对称密码系统(asymmetric cryptosystem) ,使用为系统每个用户单独组合的公钥和 私钥。 后面的小节\"现代密码学\"将探讨对称和非对称概念。 如果你开发的密码系统将用千提供保密性,你必须考虑第 章讨论过的 种不同类型的 数据。","- .静态数据(data at rest) ,或被存储的数据,是指驻留在一个永久位置上等待被访问的 数据。保存在硬盘、备份磁带、云存储服务、 USB 装置和其他存储介质中的数据都 属于静态数据。 - .动态数据(data in motion) ,或线路上的数据,是指正在两个系统之间通过网络传送的 数据。"]},{"sec":"6.2 现代密码学","body":["现代密码系统通过复杂算法(在计算上很复杂的算法)和长密码密钥来实现密码学的保密 性、完整性、身份认证和不可否认性目标。以下各节将首先讨论密码密钥在数据安全领域中 扮演的角色,然后介绍当今常用的三类算法:对称加密算法、非对称加密算法和哈希算法。 ### 6.2.1 密码密钥 早期密码学有一条\"通过隐匿获得安全\"的主导原则。","当时的一些密码学家认为,确保 一种加密算法安全的最佳方法是把算法的细节藏匿起来,不让外人知道。老密码系统要求通 信双方保守秘密,不让第二方知道用千加密和解密消息的算法。算法的任何泄露,都有可能 导致整个系统被敌人破解。 现代密码系统不依靠算法的保密性。事实上,大多数密码系统的算法都会在相关文献和 互联网上广泛公开,供公众查看。","面向大众公开算法,其实可以敦促算法不断提高自身安全 性。计算机安全界对算法的广泛分析,使从业者得以发现和纠正算法的潜在安全漏洞,确保 其使用的算法可以最妥善地保护通信安全。 现代密码系统不再依靠秘密算法,而是依靠一个或多个密码密钥的保密性,而这些密钥 将用千为特定用户或用户群体个性化定制算法。回顾一下前面讨论的移位密码;这种密码用 一个关键词通过列移位来引导加密和解密。","用千执行列移位的算法人尽皆知-{尔从本书就 读到了它的细节!然而,列移位还可用于保护两方之间的通信 只要选用的关键词不会被 ![](_page_233_Picture_5.jpeg) 外人猜出即可。只要这个关键词是安全的,就不必在意第三方知不知道算法细节。 ` ;::;法的公开性不会破坏列移位的安全,但是这种方法天生存在多个弱点,使 -哩乒. 其面对密码分析时脆弱不堪。"]},{"sec":"6.3 对称密码","body":["你已学习了对称密钥加密法、非对称密钥加密法和哈希函数的基本概念。以下各节将深 入探讨几种常用的对称密码系统。 ### 6.3.1 密码运行模式 密码的运行模式是指密码算法为实现抵御攻击的充分复杂度而采用的转换数据的不同方 式。密码的主要运行模式有电子密码本(ECB)模式、密码块链接(CBC)模式、密码反馈(CFB) 模式、输出反馈(OFB)模式、计数器(CTR)模式、 Galois/计数器模式(GCM)和带密码块链接消 息验证码的计数器(CCM)模式。","#### .电子密码本模式 电子密码本(Electronic Code Book, ECB)模式是最容易理解的简单模式,也是最不安全的 模式。算法每次处理一个 <sup>64</sup> 位块,它只用选好的秘密密钥给块加密。这意味着,算法如果多 次遇到同一个块,斗各会生成相同的加密块。如果敌人在窃听通信,那么他们很容易根据所有 可能的加密值构建一个\"密码本\"。","收集到足够数量的块后,便可用密码分析手段来解密其中 的一些块并破解加密方案。 这一漏洞使 ECB 模式变得无法使用---------m.最短的传输除外。在日常工作中, ECB 模式只 用来交换少量数据,例如用千启动其他密码模式的密钥和参数以及数据库的计算单元。 #### 2. 密码块链接模式 在密码块链接(Cipher Block Chaining, CBC)模式中,每块未加密文本在被加密之前,都 要先借助前面刚生成的密文块接受异或(XOR)运算。","解密流程只需要解密密文并进行反向异 或运算。 CBC 执行一个初始化向量(IV)并用第一个消息块进行异或运算,每次运算生成一个 唯一的输出。必须斗各 TV 发送给接收者,可能以明文形式将 IV 附在完成的密文前面,也可能 用加密消息的同一个密钥对 IV 实施 ECB 模式的加密保护。使用 CBC 模式时,错误传播是 需要考虑的一个重要问题一—如果一个块在传输过程中被毁坏,那么这个块以及后面的块将 无法解密。"]},{"sec":"6.4 密码生命周期","body":["除了单次密本以外,听有密码系统的使用寿命都是有阳的。摩尔定律对计算能力发展趋 势的预测已被普遍接受。它指出,最先进的微处理器的处理能力大纨每两年会提高一倍。这 意味着,处理器迟早会达到能随意猜出通信所用加密密钥的力量级别。 安全专业人员在挑选加密算法时,必须重视密码生命周期问题,且必须通过适当的管治 控制确保无论需要在多长时 间内保证受保护信息不泄密,所选中的算法、协议和密钥长度都 足以保持密码系统的完整性。","以下是可供安全专炒人员使用的算法和协议管治控制: - ·规定机构可接受的密码算法,如 AES 3DES RSA - .根据被传输信息的敏感性识别可与每种算法配套使用的可接受密钥长度。 - ·枚举可用的安全交易协议,如 TLS 举例来说,如果你在设计一个密码系统以保护预计将在下周启动的业务计划的安全,你 完全没有必要担心 <sup>10</sup> 年后是否会有一台能把这些计划破解出来的处理器被开发出来。","另一方 面,如果你要保护的是可能用来建造原子弹的信息,那你几乎肯定会要求这一信息在未来 <sup>10</sup> 年里始终保密!"]}]},{"no":7,"title":"PKI 和密码应用","secs":[{"sec":"7.1 非对称密码","body":["菜的\"现代密码学\"一节介绍了私钥(对称)和公钥(非对称)密码的晶本原则。你曾学 过,对称密钥密码系统要求通信双方使用同一个共享秘密密钥,因而形成了安全分发密钥的 问题。你还曾学过,非对称密码系统跨过了这道坎,用公钥私钥对给安全通信带来方便,免 去了复杂密钥分发系统的负担。 以下各节将详细说明公钥密码的概念,还将介绍当今用得比较多的四种公钥密码系统: Rivest-Shamir-Adleman (RSA) ElGamal 、椭圆曲线密码(ECC) Diffie-Hellman 。","我们还将探 讨新兴的量子密码领域。 #### 7.1.1 公钥和私钥 你一定还记得,第 章讲过,公钥密码系统(public key cryptosystem)给每个用户都分配一 对密钥:一个公钥和一个私钥。顾名思义,公钥密码系统用户可以随意把自己的公钥交给要 与他们通信的任何人。只拥有公钥的第三方不会对密码系统有任何削弱。","另一方面,私钥留 给拥有密钥对的人单独使用。除了密钥托管和恢复安排的情况以外,用户通常不应把自己的 私钥与任何其他密码系统用户共享。 公钥密码系统用户之间的正常通信过程如图 7.1 所示。 ![](_page_253_Figure_10.jpeg) 7.1 非对称密钥加密法 请注意,这个过程不要求共享私钥。","发送者用接收者的公钥加密明文消息(P) 以创建密文 消息(C) 。接收者打开密文消息后,用自己的私钥将其解密以重建原始明文消息。 发送者用接收者的公钥给消息加密后,包括他本人在内的任何用户都将因为不知道接收 者的私钥(用千生成消息的公钥私钥对的第二部分)而不能解密这条消息。这就是公钥密码的 美妙之处一—公钥可通过不受保护的通信自由共享,然后用于在以前互不相识的用户之间建 立安全通信信道。"]},{"sec":"1.2 RSA","body":["这个最著名的公钥密码系统以它的创建者命名。 <sup>1977</sup> 年, Ronald Rivest Adi Shamir Leonard Adleman 提出 RSA 公钥算法(RSA public key algorithm) ,直到今天,这个算法始终都 是被全世界接受的一个标准。 Rivest Sh皿由和 Adleman 取得算法专利权,组建了一个名为 RSA Security 的公司,为他们的安全技术升发主流执行方案。","如今, RSA 算法已进入公共域, 被广泛用千安全通信。 RSA 算法所依靠的是因式分解大素数乘积的天然计算难度。密码系统的每个用户都用以 下步骤涉及的算法生成一对公钥和私钥。 (1) 选择两个大素数(每个都约为 <sup>200</sup> 位),用 表示。 - (2) 计算这两个数的乘和: =p \\*q - (3) 挑选一个满足以下两项要求的数 e: - CD 小千 @e (p-l)(q l) 是互素的一-这两个数没有除了 以外的公因数。","(4) 找到一个数 d, ed= 1 mod((p l)(q-1))。 (5) 作为公钥分发给密码系统的所有用户。 作为私钥保密。 如果 Alice 要发送一条经过加密的消息给 Bob, 她用卜式(其中 Bob 的公钥, 是密 钥生成过程中产生的 的乘积)从明文(P) 生成密文(C): C = P8 mod n Bob 收到消息后将执行以下计算来恢复明文消息: #### Merkle-Hellman 背包 Merkle-Hellman 背包算法是早期的另一种非对称算法,千RSA 发布的第二年被开发出来。","RSA--样,这种算法也基于进行因式分解运算的艰难性,但它所依靠的是集合理论的一个 组成部分(即超递增集)而非大素数。 Merkle-Hellman <sup>1984</sup> 年被破解,因而被证明无效。 #### 密钥长度的重要性 密码密钥的长度或许是可由安全管理员自上设定的最重要的一个安全参数。"]},{"sec":"7.2 哈希函数","body":["接下来,本章将介绍密码系统如何通过执行数字签名来证明一条消息源自密砃系统的某 一特定用户,同时确保消息在双方之间传递的过程中未曾有过改动。在你能完全掌握这个概 念之前,我们将先解释哈希函数(hash function) 的概念,探讨哈希函数的基本原理,并介绍几 个经常被用在现代数字签名算法中的哈希函数。","哈希函数的目的非常简单一提取一条可能会比较长的消息,然后从消息内容中派生一 个唯一的输出值。这个值就是我门常说的消息摘要(message digest) 。消息摘要可由消息的发 送者生成,并与整条消息一起发送给接收者,其原因主要有以下两点。 第一个原因是,接收者可用同一个哈希函数根据整条消息重算消息摘要。","接收者随后可 将算出的消息摘要与传来的消息摘要进行比较,确保原发者发送的消息与接收者收到的消息 相同。如果两条消息摘要不匹配,意味着消息在传输过程中有某种程度的改动。值得注意的 是,消息必须完全相同,摘要才可能匹配。即便消息只在空格、标点符号或内容上有微小差 异,消息摘要值也会完全不同。虽然只靠比较摘要并不能判断两条消息有多大差异,但即便 是微小的差异,也会产生完全不同的摘要值。","第二个原因是,消息摘要可用来执行数字签名算法。这个概念将在本章\"数字签名\" 一节讨论。 多数情况下,消息摘要为 <sup>128</sup> 位或更长。然而,一个个位值便可用来执行奇偶校验功能, 一个低级或个位校验和值便可用来提住一个检验单点。多数时候,消息摘要越长,它的完整 性检验越可靠。 RSA Security 公司指出,密码哈希函数有 个基本要求: - ·输入可以是任何长度。"]},{"sec":"7.4 公钥基础设施","body":["公钥加密的主要优势在于它能协助以前不相识的双方进行通信。这是通过公钥基础设施 (public key infrastructure, PKI)信任关系层级体系实现的。这些信任关系使我们能把非对称加 密法与对称加密法,以及哈希函数和数字证书结合起来使用,从而形成混合加密法。 在以下各节,你将学习公钥基础设施的基本成分以及使全球安全通信得以实现的密码学 概念,并学习数字证书的构成、发证机构扮演的角色以及生成和销毁证书的流程。","#### 7.4.1 证书 数字证书(certificate) 向通信双方保证,与之通信的确实是他们声称的人。数字证书其实 就是一个人的公钥的签注副本。当用户证实一份证书是由一个可信的发证机构(CA)签发时, 他们知道,公钥是合法的。 数字证书内含具体识别信息,它们的构成受国际标准 X.509 辖制。","符合 X.509 的证书包 含以下数据: - ·证书遵守的 X.509 版本 - ·序号(证书创建者编制) - ·签名算法标识符(规定了发证机构给证书内容数字签名时采用的技术) - 发证者名称(标识笭发证书的发训十几构) - ·有效期(规定证书保持有效的日期和时间一—起始日期和时间以及终止日期和时间) - ·主体名称(内含证书的普通名称 CN 以及拥有证书所含公钥的实体的可识别名 DN) ·主体的公钥(证书的主要内容 证书拥有者用来建立安全通信的实际公钥) 证书可为各种目的签发,其中包括以下对象的公钥: - .计算机/机器 - ·个人用户 - . 电子邮件地址 - ·开发者(代码签名的证书) 证书的主体可能包括证书名通配符,表明证书还适用千子域。","通配符被指定用星号表示。 例如,签发给\\*.example.org 的通配符证书对以下所有域都有效: - example.org - www.example.org - mail.example.org - secure.example.org 提示: ` 通配符证书只适用于一层子域。因此,\\*.example.org 证书对 www.cissp.example.org 子域无效。"]}]},{"no":8,"title":"安全模型、设计和能力的原则","secs":[{"sec":"8.1 安全设计原则","body":["系统开发的每个阶段都应该考虑安全问题。编程人员、开发人员、工程师等应该致力于 为自己升发的每个应用构建完备的安全体系,使关键应用和处理敏感信息的应用得到强度更 高的安全保护。重要的是自开发项目早期阶段就周密考虑安全的影响,因为与其给已在运行 的系统添加安全措施,不如在系统开发之时就把它们部署进去,这样要容易得多。","开发人员 应该根据安全设计原则研究、实施和管理工程进程。 #### 令注意: `除了 CISSP 目标 3.1 列出的安妇文计原则外,还有此类原则的其他常用列表,包 辛三 US-CERT 列表。 #### 8.1.1 客体和主体 对安全系统中任何资源的访问控制都涉及两个实体。其中,主体(subject)是发出资源访问 请求的主动实体。","主体通常是一个用户,但也可能是一个进程、程序、计算机或机构。客体 (object) 是主体想要访问的被动实体。客体通常是一个资源,例如一份文件或一台打印机,但 也可能是一个用户、进程、程序、计算机或机构。你要了解主体和客体涉及的各种词语,而 不是只知道用户和文件。访问是主体与客体之间的一种关系,它可能包括读、写、更改、删 除、打印、移动、备份以及许多其他操作或活动。","谓记住,主体和客体指代的实际实体会因具体访问请求而异。在一次访问事件中充当客 体的实体,到了另一次访问事件中可能会变成主体。例如,进程 向进程 请求数据。为了 满足进程 的请求,进程 必须向进程 请求数据。在这个例子(见表 8.1) 中,进程 是第 一个请求的客体,同时是第二个请求的主体。 8.1 主体和客体 这也是信任传递的一个例子。"]},{"sec":"8.2 用千确保保密性、完整性和可用性的技术","body":["为保证数据的保密性、完整性和可用性(CIA) ,必须确保可访问数据的所有组件都是安全 的且行为端正。软件设计人员采用各种技术来确保程序只能执行被要求的操作而不做其他事 情。尽管以下各节讨论的概念全都与软件程序相关,但它们也常用千各个安全领域。例如, 物理限定可保证对硬件的所有物理访问都会受到控制。 ### 8.2.1 限定 软件设计者借助\"进程限定\"约束程序的动作。","简单来说,进程限定(confmement)使进 程只能对某些内存位置和资源进行读和写。这也就是所谓的沙箱(sandboxing) ,即对进程执行 最小特权原则。限定的目的是防止数据被泄粥给未经授权的程序、用户或系统。 操作系统或某些其他安全组件不接受非法读/写请求。如果进程尝试执行超出其授权的操 作,该操作将被拒绝。","此外,操作系统还会采取后续行动,例如把违规尝试写进日志。一般 来说,违规的进程会被终止运行。限定可由操作系统本身执行(例如通过进程隔离和内存保护 执行),也可借助一个限定应用程序或服务(如 Sandboxie)或者通过虚拟化或管理程序方案(如 VMw Oracle VirtualBox) 执行。 #### 8.2.2 界限 系统上运行的每个进程都被分配了一个授权级别。","授权级别告知操作系统该进程可以执 行哪些操作。简单系统中可能只有两个授权级别:用户和内核。授权级别还告知操作系统应 该为一个进程设定怎样的界限。进程的界限(bound) 由一些限制组成,这些限制规定了进程可 以访问的内存地址和资源。界限将进程的活动限定或制约在特定的区域内。在大多数系统中, 这些界限划分出了每个进程使用的内存逻辑区。"]},{"sec":"8.3 理解安全模型的基本概念","body":["在信息安全中,模型提供了一种把安全策略形式化的手段。这些模型可以是抽象的,也 可以是直观的,但全都是为了提出一套可供计算机遵守,用千执行构成安全策略的基本安全 概念、进程和规程的明确规则。安全模型(security model)使设计人员得以把抽象陈述投射到 为构建硬件和软件规定了必要算法和数据结构的安全策略中。","因此可以说,安全模型为软件 设计人员提供了用来衡量自己的设计和执行方案的参照物。 #### 令牌、能力和标签 有几种不同的方法可用来描述客体的必要安全属性。安全令牌(token)是与资源关联的独 立客体,描述了资源的安全属性。令牌可在主体请求访问实际客体之前传达有关客体的安全 信息。在其他执行方案中,各种列表被用来存储多个客体的安全信息。","能力列表(capability list) 为每个受控客体各保存一列安全属性信息。能力列表尽管没有令牌方式灵活,但通常也能在 主体请求访问客体时提供比较快捷的查找。第三种常用属性存储方式是安全标签(security label) ,通常是附着在客体上的一个永久部分。安全标签一旦设定,往往无法更改。这种永久 性提供了另外一种防篡改保护措施,而这是令牌和能力列表都没有提供的。","你将在以下各节学习几种安全模型;所有模型都阐明了如何把安全保护措施纳入计算机 架构和操作系统设计: - .可信计算基 - ·状态机模型 - ·信息流模型 - ·无干扰模型 - ·获取授予模型 - ·访问控制矩阵 - Bell-LaPadula 模型 - Biba 模型 - Clark-Wilson 模型 - Brewer and Nash 模型 - Goguen-Meseguer 模型 - Sutherland 模型 - Graham-Denning 模型 - Harrison-Ruzzo-Ullman 模型 如果你正式地学习计算机安全、系统设计或应用程序开发,你可能还会见到更多安全模 型,包括对象能力模型、 Lipner 模型、 Boebert and Kain 完整性模型、两室分隔交换(Karger) 模型、 Gong JDK 安全模型、 Lee-Shockley 模型、 Jueneman 模型等。"]},{"sec":"8.4 根据系统安全要求挑选控制","body":["为某些类型的应用购买信息系统的用户一—例如持有极具价值(或落入坏人之手会非常 危险)的敏感信息的国家安全机构,或者持有一些价值数十亿美元的数据的中央银行或证券交 易商一—在达成交易之前往往要先了解信息系统的安全优势和弱点。这些买家通常只愿意考 虑那些事先经过正式评估并已得到某种安全评级的系统。 安全评估常常由可信的第三方负责进行;这种测试的最重要结果是表明系统达到所有基 本标准的\"批准印章 ',0 #### 8.4.1 通用准则 \"通用准则 \"(Common Criteria, CC) 定义了测试和确认系统安全能力的各种级别,级别 卜标注的数字表示执行了哪种测试和确认。","然而,即使是最高 CC 评级,也不能保证这些系 统绝对安全,或者说它们完全不存在可被恶意利用的漏洞或脆弱点一—只有认识到这一点, 才称得上明智。\"通用准则\"被设计成一个动态主观性产品评估模型,用千取代以前的静态系 统例如美国国防部的\"可信计算机系统评估准则 \"(TCSEC)和欧盟的\"信息技术安全评估 准则 \"(ITSEC) <sup>1998</sup> 年,来自加拿大、法国、德国、英国和美国的政府机构代表签署了 \"IT 安全领域通 用准则证书认可协议\",使\"通用准则\"成为一个国际标准。","自那以后,又有 <sup>23</sup> 个国家签署 了这份协议。原始协议文件已被正式采纳为一个标准,作为 ISO/IEC 15408-1 -2 -3 发布, 主标签为\"信息技术一信息安全--IT 安全评估准则\"。 ![](_page_311_Picture_4.jpeg) 注意: ` IS0/IEC15408 目前正在修订(截至 <sup>2020</sup> 年秋季,它被标记为 ISO/lED 15408-1(-2 rn-姿右 3):2020) ,可能会在本书出版时发布。","\"通用准则\"指南的目标如下: - ·提升购买者对已评估和已评级的 IT 产品安全性的信心。 - ·消除重复评估(除了其他方面,这还意味着如果一个国家/地区、一家机构或一个验证 组织在评定具体系统和配置时遵循了 CC ,则其他机构在其他国家/地区就不必重复此 项工作)。 - .提高安全评估的效率和效果。"]}]},{"no":9,"title":"安全漏洞、威胁和对策","secs":[{"sec":"9.1 共担责任","body":["共担责任(shared responsibility) 是安全设计的原则,表明任们机构都不是孤立运行的。相 反,它们与世界有着千丝万缕的联系。我们使用相同的基本技术,遵循相同的通信协议规范, 在同一个互联网上漫游,共用操作系统和编程语言的基础,我们的大部分 IT/IS 都靠解决方 案现货(无沦是商用的还是开源的)实现。","因此,我们与世界的其余部分自动交融在一起,共 同承担建立和维护安全的责任。 我们必须履行这种共担责任,在这种情况下认真扮演好自己的角色。这一概念的以下几 个方面值得着重思考。 - ·机构里的每个人都负有一定的安全责任。建立和维护安全是 CISO 和安全团队的职责。 依照安全规定执行自己的任务是正式员丁的职责。","监控环境是否存在违规行为是审计 员的职责。 - ·机构对利益相关方负有作出周密安全决策以保持机构可持续发展的责任,否则,可能 无法满足利益相关方的需要。 - .与第三方合作时,尤其是与云提供商合作时,每个实体都要清楚自己在执行正常操作 和维护安全方面所应承担的那部分共担责任。这就是人们常说的云共担责任模型,第 <sup>16</sup> 章将深入讨论该模型。","- 当意识到新漏凋和新威胁的存在时,我们应该负责地将信息披露给相关供应商或信息 共享中心(也叫威胁情报来源或服务),即便这并不是我们的职责。 ` 提示: 迹象自动共享(automated indicator sharing, ATS)是美国国土安全部(DHS) 的一项举 措,旨在促进美国联邦政府与私营部门以一种自动化和及时的方式(被称作\"机器 速度\")公开、自由地交换危害迹象(IoC) 和其他网络威胁信息。"]},{"sec":"9.2 评价和弥补安全架构、设计和解决方案元素的漏洞","body":["计算机架构是涉及计算机系统在逻辑层面的设计和构建的一门工程学科。可通过计算机 架构执行的技术机制就是可被系统设计师纳入其系统的拧制,包括分层(参见第 章)、抽象(参 见第 章)、数据隐藏(参见第 章)、可信恢复(参见第 <sup>18</sup> 章)、进程隔离(本章稍后讨论)和硬 件分隔(本章稍后讨论)。","`二也复杂,所能提供的保证就越少。更高的复杂性意味着存在漏洞的区域更多, 需要抵御威胁的区域也更多。而更多的漏洞和威胁意味着系统后续提供的安全性 更不可靠更多描述请见笫 章的\"保持简单\"小节。 ### 9.2.1 硬件 硬件(hardware) 这个词包含计算机中可以被实际触换到的任何有形部分:从键盘和显示 器,到 CPU、存储介质和内存芯片等。","需要特别留意的是,存储设备(如硬盘或闪存盘)的物 理部分虽然属于硬件,但是这些设备中的内容(由 \"0\" \"1\" 集合构成的软件以及存储在其 中的数据)不属千硬件。 #### 1. 处理器 中央处理单元(central processing unit, CPU) 通常被称作处理器(processor) 或微处理器 (microprocessor) ,是计算机的神经中枢 这块芯片(或者多处理器系统中的多块芯片)控制着 所有主要操作,直接演奏或协调使计算机得以完成预期任务的复杂计算交响曲。","令人惊讶的 是,尽管 CPU 使整个计算机系统得以执行非常复杂的任务,但 CPU 本身却只能执行一组有 限的计算和逻辑操作。操作系统和编译器负责把高级编程语言转换成 CPU 可以理解的简单指 令。之所以故意这样限制 CPU 的功能范围,是为了使 CPU 能够以超快的速度执行计算和逻 辑操作。 #### 2. 执行类型 随着计算机的处理能力不断提高,用户需要更高级的功能来使这些系统以更高的速率处 理信息,同时管理多项功能。"]},{"sec":"9.3 基千客户端的系统","body":["客户端上的漏同会把用户以及他们的数据和系统置千遭破坏乃至毁坏的风险之下。客户 端攻击是指会对客户端造成伤害的任何攻击。我们在讨论攻击时,往往假设攻击的主要目标 是服务器或服务器端组件。客户端攻击或侧重千客户端的攻击是以客户瑞本身或客户端进程 为目标的攻击。通过恶意网站把恶意移动代码(如 applet)传输给客户端上运行的脆弱浏览器, 便是客户端攻击的一个常见例子。","客户端攻击可以发生在任何通信协议上,而不只是在超文 本传输协议(HTTP)上。基千客户端的另一类潜在漏洞是本地缓存中毒的风险。 #### 9.3.1 移动代码 applet 是服务器发送给客户瑞以执行某些操作的代码对象。 applet 实际上是独立千发送它 们的服务器执行的自包含微型程序,即移动代码。","Web 竞技场在不断变化,如今, applet 使用早已不像 <sup>21</sup> 世纪 <sup>10</sup> 年代初那样普遍。但是, applet 并没有从 Web 上消失,大多数浏览 器仍然支持它们(或者仍然有支持它们的附加组件)。因此,即使你供职的机构没有在内部或 公共 Web 设计中使用 applet, 你的 Web 浏览器也可能会在浏览公共 Web 时遇到它们。","假设有-个 Web 服务器为 Web 用户提供各种金融工具。其中一个工具是抵押贷款计算 器,用千处理用户的财务信息,并根据贷款的本金和期限以及借贷人的信用信息提供每个月 的还贷额。远程 Web 服务器可向本地系统发送一个 applet, 便其自行执行这些计算,而不是 在服务器墙处理这些数据,然后把结果返回客户端系统。"]},{"sec":"9.4 基千服务器端的系统","body":["就基千服务器端(可能也包括客户端)的系统安全而言,关注的要点应该是数据流控制 (data flow control) 的问题。数据流是指数据在进程之间、设备之间、网络之间或通信信道之间 的移动。数据流管理不仅要确保以最小延迟或时延高效传输,还要用通过加密实现的哈希化 计算和保密性保护确保可靠的吞吐量。","数据流控制还要确保接收系统不会因通信流而过载, 尤其是在出现连接掉线或遭受恶意的(或自己造成的)拒绝服务的情况时。发生数据溢出时, 数据可能会丢失或损坏,也可能会触发重新传送的需要。这些结果都不是我们想要的,而数 据流控制的实施往往可以防止这些问题的发生。数据流控制可由路由器、交换机等联网设备 提供,也可由网络应用和服务提供。","负载均衡器(load balancer)用千在多个网络链接或网络设备之间传播或分配网络通信流负 载。负载均衡器还能对数据流有更多控制。负载均衡的目的是获得更优化的基础设施利用率, 最小化响应时间,最大化吞吐量,减少过载并消除瓶颈。尽管负载均衡可用于许多场景,但 它的常见用途是在服务器场或集群的多个成员之间分配负载。","为了执行负载分配,负载均衡 器可以采用各种技术,包括随机选择、循环、负载/利用率监控和首选项。有关负载均衡的更 多论述请见第 <sup>12</sup> 章。 拒绝服务(DoS)攻击可以对数据流控制造成严重损害。重要的是监控 DoS 攻击并实施抑 制措施。有关这些攻击和潜在防御机制的讨论,请见第 <sup>17</sup> 章。"]}]},{"no":10,"title":"物理安全要求","secs":[{"sec":"10.1 站点与设施设计的安全原则","body":["假如没有对物理环境的控制,任何管理的、技术的或逻辑的访问控刊技术都无法提供足 够的安全性。如果怀有恶意的人员获取了对设施及设备的物理访问权,那么他们几乎可以为 所欲为,包括肆意破坏或窃取、更改数据。物理安全的实现与维护洗及很多方面。其中一个 关键因素是选择或设计能够放置 IT 基础设施并能够为组织的运营活动提供保护的安全场所。","选择或设计安全设施的过程都始千计划。 #### 10.1.1 安全设施计划 安全设旌计划(secure facility plan) 需要列出组织的安全需求,并突出用于保障安全的方法 及机制。该计划是通过风险评估和关键路径分析来制订的。关键路径分析(critical path analysis) 是一项系统性工作,用于找出任务关键型应用程序、流程、运营以及所有必要的支撑元素间 的关系。","例如,线上商店依赖千互联网接入、计算机硬件、电力、温度控制、存储设备等。 如果关键路径分析执行得当,我们就能完整绘制出组织正常运行所必需的相互依赖、相 互作用的图像。设计安全 IT 基础设施的第一步是满足组织妳境及信息设备的安全要求。这些 基本要求包括电力、环境控制(建筑、空调、供暧、湿度控制等)以及供水/排水。","与关键路径分析同等重要的是针对已完成的或潜在的技术融合的评估。技术融合 (technology convergence) 指的是各种技术、解决方案、实用程序及系统,随时间的推移而发展、 合并的趋势。这通常会造成多个系统执行相似或兀余的任务,或者一个系统取代另一个系统 的特殊功能。虽然在某些情况下,这可提高效率、节约成本,但也容易产生单点故障,进而 成为黑客及入侵者更有价值的目标。"]},{"sec":"10.2 实现站点与设施安全控制","body":["\"物理\"控制分类应被称为\"设施\"控制,因为保护设施的控制包括政策、人员管理、 计算机技术和物理屏泽。因此,不能简单±也称这种分类为物理控制,这种说法并不准确,但 物理控制是公认的术语。 管理类物理安全控制包括:设施建造与选择、站点管理、建筑设计、人员控制、安全意 识培训以及应急响应与流程。技术类物理安全控制包括:建筑访问控制、入侵检测、警报、 视频监控系统、监视、 HVAC 的电力供应,以及火警探测与消防。","现场类物理安全控制包括: 围栏、照明、门锁、建筑材料。 在为环境设计物理安全时,需要注意各类控制的功能顺序,通常顺序如下: (1) 威慑 - (2) 拒绝 - (3) 检测 - (4) 延迟 - (5) 判定 - (6) 决定 安全控制的部署首先要能够\"威慑\"(例如使用边界限制)入侵者并抑制其接近物理资产 的企图。","如果威慑无效,应\"拒绝\"(如采用上锁的门)入侵者接触物理资产。如果拒绝失败, \"检测\"系统应能及时发现入侵行为(如使用运动传感器)。如果入侵者入侵成功,\"延迟\"措 施应尽晕延迟入侵者的闯入,以便安保人员有充分时间做出响应(如加固资产)。安保人员或 法律机构应判定事件原因或评估情况,然后根据评估结果决定实施什么应对措施,例如逮捕 入侵者或收集进一步调查的证据。","` ::;贞通常用于保护较小的设备,使其更难被盗。大多数便携式系统都是用轻金 属和塑计制成的,但窃贼不愿意偷窃电缆锁定的设备,因为当他们试图销赃时, 若将电缆锁从安全/锁定插槽中强行取出,设备将很容易被损坏。 #### 10.2.1 设备故障 组织可采用多种形式预防设备故障。在一些非关键场景,只要知道在 <sup>48</sup> 小时内从哪里能 购买到配件,并进行更换即可。"]},{"sec":"10.3 物理安全的实现与管理","body":["组织可以在环境中部署多种物理访问控制机制,从而控制、监视和管理对设施的访问。 从威慑到探测,这些机制涵盖的范围很广。设施与场所中的各部分、分部或区域也应清楚地 划分出公共区、专用区或限制区。每个区域都需要配备侧重点不同的物理访问控制、监视及 预防措施。下面讨论的这些技术手段主要用千多种区域的划分、分隔与访问控制,包括边界 安全和内部安全。","标识可用千向未经授权的人员宣告受控区域,指示该区域正在使用安全摄像头,并展示 安全警告。标识有助于阻止轻微的犯罪活动,建立记录事件的基础,并引导人们遵守规则或 安全预防措施。标识通常是文字或图像的物理显示,但数字标志和警告横幅也应实现本地和 远程连接。如果法规未强制要求,则应对门锁、围栏、大门、门禁前厅、旋转门、摄像头和 所有其他物理安全控制装置实施自行制订的测试时间表。","#### 10.3.1 边界安全控制 对于建筑或园区而言,是否方便进出这一点也很重要。单个出口非常利千安全保卫,但 多个出口在发生紧急情况时更便千人员的疏散和逃生。附近的道路(如住宅街道或高速公路) 情况如何?有哪些便捷的交通方式(火车、高速公路、机场、船舶)?一天的旅客流呈有多少? 出入的方便性受到边界安全需要的制约。","访问与使用的需求也应支持边界安全的实现与 运营。物理访问控制、人员监视、设备进出、发生事件的审计与日志,这些都是维护组织总 体安全的关键因素。 1. 围栏、门、旋转门与访问控制门厅 \"围栏\"是一种边界界定装置。围栏清楚地划分出处丁特定安全保护级别的内外区域。 建造围栏的部件、材料以及方法多种多样。它可以是喷涂在地面上的条纹标志,也可以是锁 链、铁丝网、水泥墙,甚至可以是使用激光、运动或热能探测器的不可见边界。"]},{"sec":"10.4 本章小结","body":["在任何环境和情况下,安全方案的首要目标都是保护人。物理安全的实现与维护有几个 重要元素。其中的一个核心元素是存放 IT 基础设施并充当组织运营场所的建筑的选择或设 计。首先要制订计划,列出组织的安全需求,并突出实现这些安全需求的方法与机制。计划 的制订要通过关键路径分析过程来完成。安全设施计划的附加要素是评估站点选择和可见性 要求,并考虑设施设计元素,如通过环境设计预防犯罪(CPTED) 用于管理物理安全的安全技术可以分为三大类:管理类(经营、管理、流程)、技术类(逻 辑)和现场类。","管理类物理安全控制包括:设施建造与选择、站点管理、建筑设计、人员控制、 安全意识培训以及应急响应与流程。技术类物理安全控制包括:建筑访问控制、入侵检测、 警报、安全摄像头、监视、 HVAC 的电力供应,以及火警探测与消防。现场类物理安全控制 包括:围栏、照明、门锁、建筑材料、访问控制门厅(以前称为捕人陷阱)、警犬与警卫。","配线间与服务器机房是需要保护的重要基础设施。它们经常用于放置核心网络设备和其 他敏感设备。保护的手段包括:各类门锁、用于身份认证的智能卡、接近式设备和读卡器、 入侵检测系统、摄像头、监控、访问控制及常规的安全检查。 物理访问控制及设施安全保护的一个重要方面,是保护环境的基本要素,包括使用介质 存储设施、证据存储和工作区域限制。","此外,同样重要的是提供清洁的电源、减少干扰和管 理环境。 不能忽视火灾的探测与消防。火灾探测与消防系统的设计不仅要考虑保护人的安全,还 应努力将由火、烟雾、高温以及灭火剂造成的损失降到最小,而且要重点保护 IT 基础设施。 实施和管理的其他物理安全机制包括:边界安全控制、围栏、门、旋转门、访问控制门 厅、照明、警卫、警犬、锁、胸卡、受保护的电缆分布、动作探测器、入侵警报和二次验证 机制。"]}]},{"no":11,"title":"安全网络架构和组件","secs":[{"sec":"11.1 OSI 模型","body":["协议可通过网终在计算机之间边行通信。协议是一组规则和哏制,用于定义数据如何通 过网络介质(如双绞线、尤线传输等)进行传轮。国际标准化组织(ISO) <sup>20</sup> 世纪 <sup>70</sup> 年代晚期 开发了开放系统互连(OSI) 参考模型。 ### 11.1.1 OSI 模型的历史 OSI 参考模型(通常被称为 OSI 模型)不是第一个,也不是唯一一个尝试建立通用通信标 准的模型。","事实上,当今使用最广泛的 TCP/IP 协议(基千国防部高级研究计划局模型,现在 也被称为 TCP/IP 模型)是在 <sup>20</sup> 世纪 <sup>70</sup> 年代早期开发的。直到 <sup>20</sup> 世纪 <sup>70</sup> 年代晚期, OSI 型才被开发出来(直到 <sup>1984</sup> 年才正式作为 ISO 标准 <sup>7498</sup> 发布)。","OSI 模型的开发旨在给所有计算机系统建立通用的通信结构或标准。 OSI 模型充当着一 个抽象框架或理论模型,用千描述协议在理想的世界里以及理想的硬件上应如何运行。因此, OSI 模型已成为一个共同参考。 #### 11.1.2 OSI 功能 OSI 模型将网络任务分为七层。每层负责执行特定任务或操作,以支持两台计算机之间 的数据交换(即网络通信)。","这些层用名称或层号来表示(参见忍 11.1) ;每一层都按特定顺字排 列,以表明信息如何通过不同的通信层进行传递。每一层直接与上面的层以及下面的层通信。 11.1 OSI 模型的表示 #### <sup>11</sup> 1.3 封装/解封 OSI 模型代表的是多个协议(即多层协议)分层集合的协议栈,协议层之间的通信通过封 装和解封实现。"]},{"sec":"11.2 TCP/IP 模型","body":["TCP/IP 模型(也称为 DARPA 模型或 DOD 模型)仅由四层组成,而 OSI 参考模型则为七 层。 TCP/IP 模型的四个层分别是应用层(也称为进程)、传输层(也称为主机到主机)、互联网 层(也称为网络互联)和链路层(尽管使用网络接口,有时也使用网络访问)。图 11.5 显示了它 们与 OSI 模型的七个层的对比。","TCP/IP 协议套件的开发早千 OSI 参考模型的创建。 ![](_page_441_Figure_7.jpeg) 11.5 OSI 模型与 TCP/IP 模型进行比较 `贮 模型层名称和 OSI 模型层名称可互换使用,因此必须了解在各种上下文中 如何选用模型。除非另有说明,否则始终假设以 OSI 模型为基础,因为它是使用 最广泛的网络参考模型。","TCP/IP 模型直接源自 TCP/IP 协议套件或许多单独协议组成的协议栈。 TCP/IP 是一种基 千开放标准的独立于平台的协议。 TCP/IP 几乎支待所有操作系统,但会消耗大量系统资源并 且相对容易被入侵,因为它的设计初衷是易用性和互操作性,而不是安全性。 TCP/IP 的漏洞很多。如果在各种操作系统中不正确地实现 TCP/IP 堆栈,将容易受到缓 冲区溢出攻击、 SYN 洪水攻击、各种拒绝服务(DoS)攻击、碎片攻击、超大数据包攻击、欺 骗攻击、中间人攻击(路径攻击)、劫持攻击和编矶错误攻击。","TCP/IP(以及大多数协议)也会受 到监视或嗅探等被动攻击。窃听和其他攻击将在第 <sup>12</sup> 章末尾进行更详细的讨论。"]},{"sec":"11.3 网络流量分析","body":["网络流量分析是管理网络的基本功能。它可以用千跟踪恶意通信、检测铅误或解决传输 问题。然而,网络窃听也可能袚用千违反通信保密性和/或充当后续攻击的信息收集陈段。 协议分析器是用于检查网络流彗内容的工具。协议分析器可以是安装在典型主机系统上 的专用硬件设备或软件。协议分析器是一种帧/数据包捕获工具,可以收集网络流量并将其存 储在内存或存储设备中。","捕获帧或数据包后,可以使用复杂的自动化工具和脚本或手动对其 进行分析。协议分析器也可被称为嗅探器、网络评估器、网络分析器、流量监视器或包捕获 实体。嗅探器通常是一种数据包(或帧)捕获工具,而协议分析器能够解码和解释数据包/帧 内容。 朸议分析器通常将 NIC 置于混杂模式,以查看和捕获本地网段上的所有以太网帧。","在混 杂模式下, NIC 忽略以太陨帧的目标 MAC 地址,并收集到达接口的每个帧。协议分析器可 以检查单个帧,直至二进制级别。大多数分析器或嗅探器会自动将标题的内容解析为可扩展 的输出行形式。在标题详细信息中可以很容易地看到任何配置或设置。数据包的有效负载通 常以十六进制和 ASCII 格式显示。协议分析器通常同时提供捕获过滤器和显示过滤器 捕获 过滤器是一组规则,用千控制哪些帧被保存到捕获文件或缓冲区中,以及哪些帧被丢弃。","显 示过滤器仅显示数据包文件或缓冲区中符合要求的帧。 协议分析器非常多样,从简单的原始帧/数据包捕获工具,到全自动分析引擎,各有不同。 其中有开源(如 Wireshark)和商业(如 Omnipeek NetWitness NetScout)选项。"]},{"sec":"11.4 通用应用层协议","body":["OSI 模型的应用层存在许多特定于应用或服务的协议。 Telnet, TCP <sup>23</sup> 端口,是一个终端仿真网络应用程序,支持远程连接以执行命令和运行 应用程序,但不支持文件传输。不应使用 Telnet, 而应该用 SSH 替代。 FTP, TCP20 端口(活动数据连接)/短暂(被动数据连接)和 <sup>21</sup> (控制连接)端口,是一个网 络应片程序,支持需要匿名或特定身份认证的文件传输。","不应使用 FTP, 而应该用 SFTP FTPS 替代。 TFTP, UDP69 端口,是一个支持不需要身份认证的文件传销的网络应用程序。用千承 载网络设各配置文件,并可支持多播。不应使用 TFTP SMTP, TCP25 端口,是一种用于将电子邮件从客户端传输到电子邮件服务器以及从一 个电子邮件服务器传输到另一个电子邮件服务器的协议。","仅在使用 TLS 加密创建 SMTPS 使用。 POP3, TCP <sup>110</sup> 端口,是一种用于将电子邮件从电子邮件服务器上的收件箱中拉到电子 邮件客户端的协议(即客户端存档)。仅在使用 TLS 加密创建 POPS 时使用。 IMAP(IMAP4), TCP <sup>143</sup> 端口,是一种用千将电子邮件从电子邮件服务器上的收件箱拉 到电子邮件客户端的协议。","IMAP 能仅从电子邮件服务器中检索标头并直接从电子邮件服务 器删除邮件(即服务器存档)。仅在使用 TLS 加密创建 IMAPS 时使用。 DHCP, UDP 67(服务器)端口和 <sup>68</sup> (客户端)端口,用于集中控制启动时为系统分配的 TCP/IP 配置设置。 HTTP, TCP <sup>80</sup> 端口,是用明文将 Web 页面元素从 Web 服务器传输到 Web 浏览器的 协议。"]}]},{"no":12,"title":"安全通信与网络攻击","secs":[{"sec":"12.1 协议安全机制","body":["TCP/IP(Transmission Control Protocol/Internet Protocol, 传输控制协议/互联网协议)是互联 网及大多数网络中使用的主要协议族。虽然这是一种健壮的协议族,但存在大量的安全缺陷。 为提高 TCP/IP 的安全性,业界开发了大量子协议、机制、应用来保护传输数据的保密性、 完整性及可用性。","要记住,叩使是 TCP/IP 的基础协议族,也有数百个甚至数千个单独的协 议、机制及应用在互联网中广泛使用。其中一些提供安全服务,一些保护完整性,一些保护 保密性,还有一些提供安全身份认证及访问控制。下面讨论一些常见的网络及协议安全机制。 ### 12.1.1 身份认证协议 点对点协议(Point-to-Point Protocol, PPP)是一种封装协议,旨在支持通过拨号或点对点链 路传输 1P 流量。","PPP 是数据链路层协议,允许支持串行链路的 WAN 设备的多供应商互操作。 虽然它目前很少被用在典型的以太网络中,但它是许多现代通信的基础,也是通信认证的基 础。 PPP 包括广泛的通信服务,如 1P 地址的分配和管理、同步通信的管理、标准化封装、多 路复用、链路配置、链路质量测试、错误检测以及功能或选项协商(如压缩)。","PPP RFC <sup>1661</sup> 中记录的互联网标准。它取代了串行线路网间协议(SLIP) SLIP 不提 供身份认证,只支持半双工通信,没有错误检测功能,并且需要手动建立和拆卸链路。 PPP 支待自动连接配置、错误检测、全双工通信和身份认证选项。最初用千身份认证的 PPP 选项 PAP CH战和 EAP PAP(Password Authentication Protocol, 密码身份认证协议) PAP 使用明文传输用户名 与密码。"]},{"sec":"12.2 语音通信的安全","body":["电讯是向组织提供电话服务的方法的集合,或组织使用电话服务进行语音和/或数据通信 的机制的集合。电讯包括公共交换电话网(PSTN)(又名普通老式电话服务,或 POTS) 、专用交 换机(PBX) 、移动/蜂窝服务(参见第 章)和 VoIP #### 12.2.1 公共交换电话网 以前,语音通信的脆弱性与信息技术系统安全是无关的。","然而,随着语音通信更多地采 用数字设备和 VoIP, 语音通信的安全变得越来越重要了。随着语音通信越来越依赖于 IT 础设施,身份认证及完整性保护机制正变得日益重要。此外,还需要采用加密装置或协议来 保障语音通信过程中的保密性。 PBX PSTN 语音通信易受到拦截、窃听、 tapping 及其他破解技术的攻击。","通常,在组 织的物理范围内,要通过物理安全来保护语音通信的安全。在组织场所外部,语音通信的安 全主要由提供通信线路租用服务的公司来负责。如果语音通信在安全策略中占据重要位置, 就应部署并使用加密通信机制。 PSTN 曾是许多企业唯一或主要的远程网络链接,直到高速、经济且随处可用的访问方 法出现。随若宽带和无线服务越来越普及,家庭用户互联网连接的 POTS/PSTN 正逐渐减少。","但是,当宽带解决方案失败时, PSTN 连接有时仍然会被用作远程连接的备份选项。 PSTN 能仍然是农村互联网和远程连接的唯一选择。当 VoIP 或宽带解决方案不可用、中断或不符合 成本效益时, PSTN 还会被用作标准语音线路。 ### 12.2.2 VoIP IP(Voice over Internet Protocol, 网络电话)是一种将语音封装在 IP 包中的技术,该技术 支持在 TCP/IP 网络中打电话。"]},{"sec":"12.3 远程访问安全管理","body":["远程办公或远程工作已经成为商业计算中的常态。远程办公通常需要远程访问,也就是 远程客户与网络建立起通信会话的能力。远程访问可能采取下列形式: - ·在互联网上通过 VPN 接入网络。 - .连接到 WAP(本地环境将其视为远程访问)。 - .通过瘦客户端连接接入终端服务器系统、大型机、虚拟私有云(VPC)端点、虚拟桌面 接口或虚拟移动接口。","- ·使用远程桌面服务,如 Microsoft Remote Desktop TeamViewer GoToMyPC LogMeIn CitrixWorkspac-e 或邓 ,按入位丁办公区的个人计绊扒。 - .使用基千云的桌面解决方案,如 Amazon Workspace Amazon AppStream V2 Cloud Microsoft Azure - .使用调制解调器直接拨入远程访问服务器。","个例子使用完整的客户机。建立的连接就像直接接入局域网(LAN) 。后 个例子中, 所有计算活动都发生在连接的中央系统中,而不是在远程客户端上。 #### 12.3.1 远程访问与远程办公技术 远程办公就是在外部场所(非主要办公区)进行工作。实际上,远程办公很可能已经成为 现有工作的一部分了。远程办公客户使用多种远程访问技术,与中心办公网络建立连接。","远 程访问技术主要有四种类型。 特定服务特定服务类型的远程访问,为用户提供远程接入和使用单一服务(如邮件)的 功能。 远程控制 远程控制类型的远程访问使远程用户能够完全控制物理上相距遥远的系统。 显示器与键盘就像直接连接在远程系统上一样。 远程节点操作 远程节点操作只是远程客户端与 LAN 建立直接连接时的另一个名称, 例如使用无线、 VPN 或拨号连接。"]},{"sec":"12.4 多媒体协作","body":["多媒体协作就是使用多种支持多媒体的通信方法,以加强远距离的合作(身处不同地方的 人参与同一个项目)。通常,该种合作支持项目人员同时(或不同时)开展工作。合作需要跟踪 上匕 上、、 文档编辑、实时文件交换、版本控制及其他工具结合起来使用。多媒体协作通常也是一种先 进的远程会议技术。 无论实施何种 SaaS 服务来支待多媒体协作,都必须根据组织的安全策略对其进行彻底审 查。","不能仅仅因为有人在远程工作就放松安全管理。重要的是验证连接是否已被加密,是否 正在使用可靠的多因素身份认证,以及托管组织是否可以查看跟踪。 ### 12.4.1 远程会议 远程会议技术可应用于任何产品、硬件或软件,支持远程实体间进行交互。这些技术或 方案被冠以很多术语:数字合作、虚拟会议、视频会议、软件或应用合作、共享白板服务、 虚拟培训方案等。","任何支持不同用户之间进行通信、交换数据、协作完成材料/数据 文档以 及其他合作的服务,都可被视为远程会议技术服务。 无论采用哪种形式的多媒体协作,都必须评估随之而来的安全影响。在部署或使用之前, 需要询问许多有关安全性的问题,并找到令人满意的答案。 - .服务是否使用了强身份认证技术? - .通信是否采用了开放协议或加密通道? - ·加密是从端点到中心服务器,还是端到端? - .是否允许真正删除会议内容? - .是否对用户活动进行审计与日志记录? - .未经授权的实体能否参加私人会议? - ·与会者能否通过语音、图像、视频或文件共享插入会议? - .平台是否将广告/垃圾邮件集成到界面中,是否可以禁用? - .使用了什么跟踪机制?可以禁用跟踪吗?收集的数据是用千什么的? - ·会议被记录下来了吗?谁有权接触这些记录?它们可以被导出和分发吗? 多媒体协作和其他形式的远程会议技术能改善工作环境,并允许全球范围内的各种员工 参与其中,但前提是通信安全得到了保证,并且员工接受培训后能够有效地使用它并遵守公 司政策。","### 12.4.2 即时通信和聊天 IM(instant messaging, 即时通信,实时消息或聊天)是一种实时通信工具,能为互联网上 任何地方的两个或更多用户提供基于文字的聊天功能。一些 IM 工具支持文件传输、多媒体、 语音、视频会议等功能。有些形式的 IM 基千端对端服务,而有些采用集中控制服务器。"]}]},{"no":13,"title":"管理身份和认证","secs":[{"sec":"13.1 控制对资产的访问","body":["控制对资产的访问是安全的中心主题,你将发现,许多安全控制措施协同工作来实现访 问控制。请注意,资产可以是有形的或无形的。有形资产是指你可以触摸的东西,如物理设 备,而无形资产是指信息和数据,例如知识产权。除了人员之外,资产还可以是信息、系统、 设备、设施或应用程序。 信息 组织的信息包括其所有数据。数据可以存储在服务器、计算机和较小设备上的简 单文件中,也可存储在服务器群中的大型数据库中。","访问控制尝试阻止信息的未授权访问。 系统 组织的系统包括提供一个或多个服务的任何 IT 系统。例如,一个存储用户的简单 文件服务器是一个系统。另外,一个与数据库服务器协同提供电子商务服务的 Web 服务器也 是一个系统。 设备 设备是指任何计算系统,包括服务器、台式计算机、便携式笔记本电脑、平板电 脑、智能手机和外部设备(如打印机)。","组织越来越多地采用措施,允许员工将其个人设备(如 智能手机或平板电脑)连接到组织网络。虽然设备通常是员工拥有的,但设备上存储的组织数 据仍然是组织的资产。 设施 组织的设施包括其拥有或租赁的任何物理场所。设施可以是单独的房间、整个建 筑物或几个建筑物构成的整个建筑群。物理安全控制措施有助于保护设施。 应用程序 应用程序往往提供组织的数据访问。","应用程序的访问控制可以为组织的数据 提供一个额外的控制层。权哏是一种简单的方法,可以限制应用程序的逻辑访问,并且可以 分配给特定用户或组。 #### 13.1.1 控制物理和逻辑访问 除了要了解需要保护的资产是什么之外,你还必须知道如何保护资产。你可以通过物理 安全控制和逻辑访问控制来实现资产保护。 <sup>10</sup> 章深入探讨了物理安全控制。"]},{"sec":"13.2 管理身份标识和认证","body":["身份标识(identification) 是主体声明或宣称身份的过程。主体必须向系统提供身份标 识,从而启动身份认证、授权和问责流程。主体提供身份标识时可能需要输入用户名,刷智 能卡,说出短语,将脸部、手掌或手指置千相机前或靠近扫描设备。身份认证的核心原则是 所有主体必须具有唯一的身份标识。 身份认证(authentication) 将一个或多个因素与有效身份标识数据库(如用户账户)进行 比对,从而验证主体的身份。","用千验证主体身份的认证信息是私有信息,并且需要进行保护。 例如,口令很少以明文形式存储在数据库中。相反,身份认证系统在数据库中存储口令哈希值。 \\_ 注意: 身份标识和身份认证作为一个流程的两个步骤同时发生。第一步是提供身份标识,第\\_ 步是提供身份认证信息。如果缺少身份标识和身份认证,主体就无法访问系统。","相比之下,假设一个用户声明了自己的身份(如用户名 jobn.doe@sybex.com) ,但没有证 明身份(使用口令)。此用户名属于一位名为 John Doe 的员工。但是,如果系统接受没有口令 的用户名,便无法证明该用户是 John Doe 。所有知道 John 用户名的人都可以冒充他。 每种身份认证技术或因素都有其优缺点。","因此,必须在部署环境的上下文中评估每种身 份认证机制。例如,处理绝密信息的工具需要非常强大的身份认证机制。相比之下,课堂环 境中学生的身份认证要求要低得多。 身份标识和身份认证方法在对人员进行身份认证时也会对设备和服务进行身份认证。本 章后面的\"设备身份认证\"和\"服务身份认证\"部分更深入地解释了设备和服务。"]},{"sec":"13.3 实施身份管理","body":["身份管理实现技术通常分为两类:集中式和分散式/分布式。 .集中式访问控制意味着所有授权验证都由系统内的单个实体执行。 ·分散式访问控制(也称为分布式访问控制)意味着整个系统中的各类实体执行授权验证。 小型团队或个人可以管理集中式访问控制。集中式访问控制的管理开销较低,因为所有 更改都在单个位置进行,并且单个更改会影响整个系统。","然而,集中式访问控制可能会产生 单点故障,这是它的一个缺点。 集中式身份管理解决方案的另一个好处是它可以通过扩展来支持更多用户。例如,微软 活动目录服务域可以仅从单个域控制器开始。随着公司的发展,管理员可以添加额外的域控 制器来处理额外的流星。 分散式访问控制通常需要多个团队或多人管理。分散式访问控制的管理开销较高,因为 必须在多个位置实施修改。","随着访问控制点数量的增加,整个系统会越来越难以保持一致性。 任何单个访问控制点所做的修改均需要在所有访问点重复。 #### 13.3.1 单点登录 单点登录(SSO)是一种集中式访问控制技术,允许主体在系统上进行单次身份认证并访问 多个资源,而不必再次进行身份认证。 SSO 对用户而言非常方便,而且有安全方面的优势。","当必须记住多个用户名和口令时,用户通常会将其抄下来,最终降低安全性。用户不太可能 只写下单个口令。 SSO 还通过减少主体的账户数量来简化管理。 SSO 的主要缺点是,攻击者一旦侵入账户,就可以获得对所有授权资源的无限制访问权 限。但大多数 SSO 系统都拥有保护用户凭证的方法。下面讨论几种常见的 SSO 机制。"]},{"sec":"13.4 管理身份和访问配置生命周期","body":["身份和访问配置生命周期是指账户的创建、管理和删除。尽管看起来可能很普通,但这 些活动对于系统的访问控制功能至关重要。如果没有正确定义和维护用户账户,系统就无法 建立准确的身份标识,执行身份认证,提供授权和跟踪责任。如前所述,身份识别发生在主 体声称身份时。用户账户是最常见的身份标识,但身份标识也包括计算机账户和服务账户。","#### 13.4.1 配置和入职 组织通常在雇用新员工后执行一个入职流程。入职流程包括创建用户账户并为其提供新 工作所需的所有权限。 新用户账户的创建通常是一个简单的流程,但必须通过组织安全策略程序保护该流程。 不应该根据管理员的心血来潮或任意请求来创建用户账户。相反,适当的配置可以确保员工 在账户创建时遵循特定程序。","新用户账户的初始创建通常被称为登记或注册。我们唯一必须提供的信息是用户名或唯 一标识符。但是,根据组织的既定流程,注册信息通常包括用户的多个详细信息,如用户的 全名、电子邮件地址等。当组织使用生物识别方法进行身份认证时,生物识别数据也在此注 册过程中被收集和存储。 应通过组织认为充分且必要的方式来证明新员工的身份,这点也很重要。","在将个人注册 到安全系统之前,身份证件、出生证明、背景调查、信用检查、安全许可验证、 FBI 数据库 搜索,甚至征信调查都是验证其身份的有效形式。 许多组织都拥有自动配置系统。例如,一旦雇用某个人,人力资源部门就可以完成初始 身份标识和处理步骤,然后将请求转发给 IT 部门以创建账户。 iT 人员通过自动配置系统输 入员工姓名和所属部门等信息,然后自动配置系统使用预定义的规则创建账户。"]}]},{"no":14,"title":"控制和监控访问","secs":[{"sec":"14.1 比较访问控制模型","body":["<sup>13</sup> 章重点关注身份标识和身份认证口在验证主体身份后,下一步就是进行授权。授权 主体访问客体的方法取决千 IT 系统采用的访问控制方法。 `提示: 尹王」主体是访问被动客体的活动实体,客体是向活动主体提供信息的被动实体。例如, 当用户访问文件时,用户是主体,文件是客体。 #### 14.1.1 比较权限、权利和特权 在研究访问控制专题时,你经常遇到权限、权利和特权等术语。","有人会混用这些术语, 但这些术语并不总是表达相同的含义。 权限权限通常是指授予对客体的访问权限,并明确允许对客体执行的操作。如果具有 文件的读取权限,那么你可打开并读取文件。你可以授予用户创建、读取、编辑或删除文件 的权限。同样,你可以授予用户对某个文件的访问权利,因此在此场景中,访问权利和权限 是同等含义。","例如,如果获得应用程序文件的读取和执行权限,你就拥有运行应用程序的权 利。此外,你可以获得某个数据库的数据权利,因而可以检索或更新数据库中的信息。 权利 权利主要是指对某个客体采取行动的能力。例如,用户可以有权利修改计算机系 统时间或恢复备份数据。权利和权限有细微的区别,并不总被刻意强调。然而,你很少看到 在系统上采取行动的权利被称作权限。","特权特权是权利和权限的组合。例如,计算机管理员将拥有全部特权,即授予计算机 管理员对计算机的全部权利和权限。计算机管理员可以在计算机上执行任意操作并访问所有 数据。 #### 14.1.2 理解授权机制 访问控制模型使用许多不同类型的授权机制或方法来控制哪些主体访问特定客体。下面 简要介绍一些常见的授权机制及概念。"]},{"sec":"14.2 实现认证系统","body":["身份认证系统简化了互联网和内部网络的身份认证管理。第 <sup>13</sup> 章更深入地讨论了联合身 份管理(FIM)和单点登录(SSO)概念,但请注意, FIM 允许不同组织联合使用 SSO 。例如,员 工在登录 公司网络后,不必再次登录即可访问 公司的网络资源。 ### 14.2.1 互联网上实现 SSO 除了联合身份管理系统之外,许多站点还支持 SSO 以简化用户体验。","这些站点还确保用 户在某个站点上的身份凭证不会被其他站点共享,从而为用户提供安全性。 设想一下,你想将资金从 银行转移到 银行。如果你将自己的凭证提供给 银行, 然后让 银行转移资金。这听起来是否非常吓人?答案是肯定的。你决不允许将自己的凭证 提供给第三方。 SAML OAuth OpenID OIDC 等解决方案有助千解决此问题。","这些解决 方案可以共享有关用户的身份认证、授权或配置文件信息,而一些解决方案共享所有信息。 1. XML 可扩展标记语言(XML) 并非仅通过实际描述数据来描述如何显示数据。 XML 可以包含标 记,从而描述所有所需数据。例如,以下标签将数据标识为参加考试的结果: <ExamResults>Passed</ExamResults> 多个供应商的数据库可以依托 XML 格式导入和导出数据,从而使 XML 成为交换信息的 通用语言。","XML 存在许多特定模式,如果公司之间对 XML 模式达成共识,则公司之间可以 轻松共享信息。许多云提供商使用基于 XML 的语言来共享身份认证和授权信息。许多云提 供商不是直接使用 XML, 而是使用其他基千 XML 的语言。 2. SAML 安全断言标记语言(SAML) 是一种基千 XML 的开放标准,通常用千在联邦纠织之间交换 身份认证和授权(AA)信息。"]},{"sec":"14.3 了解访问控制攻击","body":["如第 <sup>13</sup> 章所述访问控制的一个目标是预防对客体的未授权访问,包含对任何信息系统 的访问,如网络、服务、通信链接和计算机,以及对数据的未授权访问。除了访问控制之外, IT 安全方法还寻求预防未授权的数据泄露和未授权的资产变更,并提供一致的资源可用性。 换句话说, IT 安全万法试图防止保密性、完整性和可用性遭到破坏。","安全专业人员需要了解常见的攻击方法,以便采取主动措施来预防攻击,并在攻击发生 时识别出它们,同时做出合适的响应。下述部分对风险要素进行快速回顾,并介绍了常见的 访问控制攻击。 虽然本节聚焦在访问控制攻击,但重要的是意识到其他章节也涵盖了许多其他类型的攻 击。例如,第 章涵盖了各种密码分析攻击。 #### 破解者`黑客和攻击者 破解者是充满恶意的个人,试图对个人或系统发起攻击。","破解者试图破解系统的安全性 并加以利用,其动机通常包括贪婪、权力或认可。其行为可能导致财产(如数据和知识产权) 损失、系统瘫痪、安全受损、负面舆论、市场份额丢失、盈利能力下降和生产力下降。在许 多情况下,破解者简直就是罪犯。 <sup>20</sup> 世纪 <sup>70</sup> 年代和 <sup>80</sup> 年代,黑客被定义为没有恶意的技术爱好者。","然而,媒体现在使 用黑客术语来代替破解者。黑客术语的使用非常广泛,以至千定义发生了变化。 为避免混淆,我们通常用攻击者表示恶意入侵者。攻击是企图利用系统漏洞并破坏保密 性、完整性和 或可用性的所有尝试。 #### 风险要素 章已深入地介绍了风险和风险管理,但值得在访间控制攻击的背景下重申一些术语。 风险是威胁利用漏洞造成损失(例如资产损坏)的可能性。"]},{"sec":"14.4 本章小结","body":["本章介绍了各种访问控制模型。对于自主访问控制(DAC)模型,所有对象都有一个所有 者,所有者可以完全控制对象。基于角色的访问控制模型使用角色或组,而且角色和组通常 与组织的层次结构相匹配。管理员为用户分配角色,同时根据工作或任务需要为角色分配权 愿基千规则的访问控制模型使用适用千所有主体的全局规则。基千属性的访问控制(ABAC) 模型使用包含属性的策略来分配访问权限。","强制访问控制(MAC)模型要求所有对象都拥有标 签,并且基千主体标签的匹配情况进行决策。基千风险的访问控制模型评估环境和情景,并 依据安全策略做出决策。 各种基于互联网的身份认证系统为用户提供单点登录(SSO) 功能。 SAML 是一种基于 XML 的标准,用于交换身份认证和授权信息。 OAuth 2.0 是一个授权框架,使用 OpenID 行身份认证。","OIDC 使用 0Auth2.0, 建立在 OpenID 使用的技术之上。它将 JSONWeb 令牌 用作 1D 令牌。 Kerberos 是一种流行的单点登录身份认证协议,在内部网络中使用票证实施身份认证。 Kerberos 使用主体数据库、对称密码学和系统的时间同步来发行票证。 RADIUS TACACS+ 是身份认证、授权和计费(AAA)协议,常用千远程访问,如 VPN 访问控制攻击包括特权提升攻击,通过特权提升攻击,可以获得更多的权利和权限。","口 令是一种常见的身份认证机制,并且存在各类试图破解口令的攻击。口令攻击包括字典攻击、 暴力破解攻击、生日攻击、彩虹表攻击、哈希传递攻击、 Kerberos 漏洞利用攻击和嗅探攻击。"]}]},{"no":15,"title":"安全评估与测试","secs":[{"sec":"15.1 构建安全评估和测试方案","body":["安全评估和测试方案是信息安全团队的基础维护活动。方案包括测试、评估和审计,旨 在定期验证组织是否具有足够的安全控制措施,以及这些措施是否正常运行并有效保护信息 资产。 在本节中,你将了解安全评估方案的三个主要组成部分: - ·安全测试 - ·安全评估 - ·安全审计 #### 15.1.1 安全测试 安全测试旨在验证某项控制措施是否正常运行。","这些测试包括自动化扫描、工具辅助的 渗透测试、破坏安全性的手动测试。安全测试应该定期实施,并关注保护组织的每个关键安 全措施。在审查安全控制措施时,信息安全管理者(infonnation security manager)应考虑以下因素: - ·安全测试资源的可用性 - .待测控制措施所保护的系统及应用程序的重要性(criticality) - ·待测系统及应用程序所含信息的敏感性 - .实现控制措施的机制出现技术故障的可能性 - .危及安全性的控制措施出现错误配置的可能性 - ·系统遭受攻击的风险 - ·控制措施配置变更的频率 - ·技术环境下可能影响控制措施性能的其他变更 - ·开展拧制措施测试的难度及时间 - ·测试对正常业务运营造成的影响 在分析每个因素后,安全团队设计和确认全面的评估和测试策略。","该策略可能包含频繁 的自动化测试,并辅以少量的手工测试。例如,信用卡处理系统每晚进行自动化漏洞扫描, 并在监测到新漏洞时立刻向管理员发出警报。自动化扫描一旦配置完成就不需要管理员的参 与,所以非常便于频繁的运行。安全团队也可以支付费用来雇用外部安全顾问,由外部安全 顾问实施手动渗透测试,以配合自动化扫描。","渗透测试可以每年开展一次,以最大限度地降 低费用并减小业务中断的影响。 `警告: :\\_,许多安全测试方案开始时过于随意,同时安全专业人员简单地将花哨的新工具应用 到所有系统中。试用新工具的想法固然不错,但是应该仔细设计安全测试方案,并 采用风险优先级的方法对系统进行严格的、例行的测试。 当然,仅简单执行安全测试是不够的。"]},{"sec":"15.3 测试软件","body":["软件是系统安全的核心组成部分。现代企业所使用的许多应用程序通常包含以下共同特征。 - ·软件应用程序通常拥有操作系统、硬件和其他资源的访问特权。 - ·软件应用程序往往处理敏感信息,包括信用卡号码、社会保险号码和专有的业务 信息。 - ·许多软件应用程序依赖千存储敏感信息的数据库。 - ·软件应用程序是现代企业的核心,执行关键业务功能。","软件故障可能对业务造成严重 破坏。 细致的软件测试对于满足现代企业的保密性、完整性和可用性要求至关重要,上面只列 出了一部分原因。 软件的设计应该考虑到上述目标受到的有关威胁,并做出适当的响应。为达到此目的, 核心设计原则是软件永远不要依赖千用户的正确操作。相反,软件应该可以预料意外情况, 并从容地处理无效输入、不正确排序的活动以及其他意外情况。","这种处理意外活动的过程被 称为异常处理。 本节中,你可以学习到许多类型的软件测试,这些测试可以被集成到自己组织的软件开 发生命周期中。 `x,注意: 本章仅涉及软件测试内容。在第 <sup>20</sup> 章,你可以深入了解软件开发生命周期(SDLC) 和软件安全问题。 ### 15.3.1 代码审查与测试 代码审查与测试是软件测试方案最关键的组成部分。","在将代码移植到生产环境前,此过 程对研发工作进行第三方审查。在应用程序正式上线前,代码审查和测试可以发现应用程序 在安全、性能、可靠性方面的缺陷,以免这些缺陷对业务运营产生负面影响。 你将在第 <sup>20</sup> 章中进一步学习如何将代码审查和测试融入软件开发生命周期。 #### 1. 代码审查 代码审查(code review)是软件评估的基础。"]},{"sec":"15.4 实施安全管理流程","body":["除了实施评估和测试外,健全的信息安全方案还包括各种管理流程,目的是监督信息安 全计划是否有效运行。这些流程为安全评估提供一个关键的反馈环路,因为它们可提供管理 监督,并对内部攻击威胁产生威慑作用。 满足这种需求的安全管理审查包括 志审查、账户管理、备份验证、关键性能和风险指 标。每项审查都应遵循一个标准化流程且审查完成后应获得管理层确认。","#### 15.4.1 日志审查 在第 <sup>16</sup> 章中,你将认识到存储日志数据、执行自动化及人工日志审查的重要性。安全信 息和事件管理(SIEM)工具包可以在这些流程中起到重要作用,使大量日志审查的常规工作实 现自动化。 SIEM 工具包利用许多设备、操作系统和应用程序提供的 syslog 功能来收集信息。","一些设备(包括 Windows 系统)可能需要安装第三方客户端来实现对 syslog 的支待。管理员可 通过 Windows 组策略对象(GPO)和其他机制来部署日志策略,这些机制可以在整个组织中部 署和实施标准策略。 日志系统还应该利用网络时 同协议(NTP)来确保向 SIEM 发送日志记录的系统和 SIEM 时钟是同步的。","这种做法保证多种来源的信息具有一致的时间轴。 信息安全管理者还应定期进行日志审查,特别是对千敏感功能,以确保特权用户不会滥 用其职权。例如,如果信息安全团队可以使用 eDiscovery 工具来检索个人用户的文件内容, 那么信息安全管理者应该定期审查信息安全团队成员的操作日志,以确保文件访问符合合规 使用 eDiscovery 的初衷,并且避免侵犯用户隐私。"]},{"sec":"15.5 本章小结","body":["为确保组织安全控制措施在一段时间内保待有效,安全评估和测试方案起着至关重要的 作用。这些控制措施可以保护信息资产的保密性、完整性和可用性,不过,业务运营、技术 环境、安全风险和用户行为的变化,都可能改变控制措施的有效性。安全评估和测试方案监 控这些控制措施,并强调需要管理人员干预的变更。安全专业人员应仔细设计评估和测试方 案,并在业务需求发生变化时对其进行修订。","安全测试技术包括漏洞评估和软件测试。通过漏洞评估,安全专业人员执行各种测试, 从而识别系统及应用程序的错误配置和其他安全缺陷。网络发现扫描通过探测开放端口来识 别网络上运行的系统。网络漏洞扣描检测这些系统是否存在已知的安全缺陷。 Web 应用程序 漏洞扫描探测 Web 应用程序的运行并搜寻已知漏洞。","因为软件处理敏感信息,并与关键资源进行交互,所以软件在所有安全基础设施中扮演 着关键角色。组织应该引入代码审查流程,从而在将代码部署到生产环境之前对代码进行同 行评审。严格的软件测试方案还包括静态测试、动态测试、接口测试和误用案例测试,从而 全面地评估软件。 安全管理过程包括日志审查、账户管理、备份验证以及关键绩效和风险指标的跟踪。","安 全管理人员运用这些流程来验证信息安全方案是否持续有效。这些流程可由不太频繁的正式 内部审计和第三方执行的外部审计进行补充。"]}]},{"no":16,"title":"安全运营管理","secs":[{"sec":"16.1 应用基本的安全运营概念","body":["安全运营实践的主要目的是保护资产,如信息、系统、设备、设施和应用程序。这些实 践有助千识别威胁和漏洞,并实施控制措施来降低资产的风险。 在信息安全的背景下,应尽关心(due care)和尽职审查(due diligence)是指采取合理的措施, 持续保护组织的资产。高级管理层对应尽关心和尽职审查负有直接责任。","实施下列常见安全 运营概念,并执行定期的安全审计和审查,展示出一定程度的应尽关心和尽职审查,可以减 轻高级管理层在损失发生时应承担的责任。 #### 16.1.1 因需可知和最小特权 因需可知(need to know)和最小特权(least privilege)是任何安全的 IT 环境都要遵循的两个 标准原则。","这两个原则通过限制对资产的访问来帮助保护有价值的资产。尽管两者是相关的, 并且对许多人来说这些术语是可以互换使用的,但两者之间存在明显差异。 #### 1. 因需可知的访问 因需可知原则要求仅授予用户执行工作所需数据或资源的访问权限。因需可知原则主要 目的是让秘密信息保持秘密状态。如果需要保守秘密,最好的办法就是不要告诉任何人。","如 果你是唯一知道它的人,你可以确保它仍然是一个秘密。如果你告诉一个可信赖的朋友,它 可能仍然是秘密。然而,你信任的朋友可能会告诉其他人——如另一位值得信赖的朋友。随 着越来越多的人知道,秘密泄露给他人的风险也随之增加。控制知悉人的范围,便增加了保守 秘密的可能性。 因需可知通常与安全许可(security clearance)关联,例如拥有\"秘密\"许可的人。"]},{"sec":"16.2 解决人员安全和安保问题","body":["人员安全是安全运营的一个基本因素。数据、服务器甚至整个建筑等总是可以被替代。 但人员却无法替代。考虑到这点,组织应该实施加强人员安全的控制措施。 例如,考虑通过按钮式电子密码锁控制数据中心出口的门。如果火灾导致停电,出口的 门是自动解锁,还是保持锁定?更重视服务器机房资产(而非人员安全)的组织可能会决定在 断电时使出口门保持锁定。","这种做法可以保护数据中心的物理资产。不过,因为无法轻易从 机房脱身,机房里面的人员会面临生命危险。与此相反,重视人员生命(而非数据中心资产) 的组织会确保在断电时使出口门处于打开状态。 ### 16.2.1 胁迫 当员工单独工作时,胁迫(duress) 系统非常有用。例如,一名警卫可能在下班后守卫一栋 楼。","如果一群人闯入大楼,该警卫可能无法独自阻止。但是,警卫可使用胁迫系统发出警报。 简单胁迫系统只有一个发送遇险呼叫的按钮。监控人员接收到遇险呼叫后,根据设定程序做 出响应。监控人员可向遇险呼叫的人拨打电话或发送短信。在这个例子中,警卫通过确认情 况来回应。 安全系统通常包含口令,员上使用口令来确认寸青况是正常的还是存在问题的。","例如,表 示一切正常的口令可能是\"一切都很棒\"。如果一名警卫无意中激活了胁迫系统,而监控人员 做出响应,那么警卫会说\"一切都很棒\",然后解释一下情况。不过,如果犯罪分子非法拘禁 警卫,警卫可以跳过口令,直接捏造如何意外激活胁迫系统的事实。监控人员将发现警卫跳 过口令,并给予救援。 一些电子密码锁支持两种或多种口令,例如一种口令用千常规使用,另一种口令用千发 出警报。"]},{"sec":"16.3 安全配置资源","body":["资产管理是安全配置资源的重要考虑因素。第 <sup>13</sup> 革介绍账户配置和取消配置,这是身份 和访问配置生命周期的一部分。本节重点关注硬件和软件资产等资源。 ### 16.3.1 信息和资产所有权 章讨论了识别、分类信息和资产的重要性。第 章还讨论了各种数据角色。在此提 醒,数据所有者对数据担负最终组织责任。","数据所有者可以是高管,如首席运营官(CEO) 总裁或部门主管。同样,高级管理人员对其他资产(如硬件资产)负最终责任。管理服务器的 IT 部门拥有这些服务器,而 IT 部门的高级管理人员承担保护责任。 关键在千通过识别资产所有者,组织还可识别出负责保护资产的人员。数据所有者通常 将数据保护工作委托给组织中的其他人。","例如,担任数据托管员角色的员工通常执行日常任 务,如实施访问控制、执行备份和管理数据存储。 #### 16.3.2 资产管理 资产管理是指管理有形资产和无形资产。资产管理通常从资产清单开始,要求跟踪资产, 并采取额外措施在整个生命周期内保护资产。 有形资产包括组织拥有的硬件资产和软件资产。无形资产包括专利、版权、公司声誉和 其他代表潜在收入的资产。","通过成功管理资产,组织可以预防损失。 许多组织使用自动配置管理系统(configuration management system, CMS)来帮助管理硬 件资产。 CMS 的主要目的是配置管理,本章稍后会讨论。在检查硬件配置时, CMS 需要连 接到硬件系统。这样做时, CMS 会验证硬件系统是否仍然存在于网络中并已经启动。"]},{"sec":"16.4 实施资源保护","body":["组织应用各种资源保护技术来确保在整个生命周期内安全配置和管理资源。例如,台式 计算机通常使用镜像技术进行部署,以确保其以已知的安全状态启动。变更管理和补丁管理 技术确保系统与所需变更保持同步。本章稍后将讨论镜像、变更管理和补丁管理等主题。 信息存储在媒介上,因此资源保护的一个重要部分是媒介保护。媒介保护包括何时保存 媒介,以及媒介何时到达其生命周期的终点。","#### 16.4.1 媒介管理 媒介管理是指为保护媒介及其存储数据而采取的步骤。在此,媒介泛指任何可存储数据 的设备。媒介包括磁带、光学介质(如 CD DVD) 、便携式 USB 驱动器、内部硬盘驱动器、 固态驱动器和 USB 闪存驱动器。许多便携式设备,如智能手机,也属千这一分类,因为便携 式设备配备了存储数据的存储卡。","因为备份数据通常保存在磁带上,因此媒介管理直接与磁 带相关。但是,媒介管理不仅涵盖备份磁带,还包括任何存储数据的介质类型。媒介管理还 包括任何类型的硬拷贝数据。 ### 16.4.2 媒介保护技术 当媒介存储敏感信息时,应该将其存储在有严格访间控制的安全场所,防止因未经授权 的访问造成数据泄露。此外,保管媒介的场所应具备温度和湿度的控制措施,防止因环境污 染造成数据丢失。","媒介管理还包括技术控制措施,以限制计算机系统对媒介的访问。例如,许多组织使用 技术控制措施禁止人员使用 USB 驱动器,或在用户尝试使用时进行检测和记录。在有些情况 下,书面的安全策略禁止人员使用 USB 闪存驱动器,并使用自动化方法检测和报告任何违规 行为。 ![](_page_653_Picture_5.jpeg) ` USB 闪存驱动器的主要凤险是恶意软件感染和数据窃取。"]}]},{"no":17,"title":"事件的预防和响应","secs":[{"sec":"17.1 实施事件管理","body":["任何安全方案都以预防安全事件作为主要目标之一。然而,尽管安全专业人员在 IT 方面 竭尽全力,事件仍会发生。这时,组织必须能做出响应,以限制或遏制事件的发展。事件管 理的主要目标是将组织受到的影响降至最低。 #### 17.1.1 事件的定义 在深入探究事件管理之前,有必要了解事件的定义。这似乎很简单,但你会发现,不同 的资料来源会给出有细微差异的不同定义。","事件一般是指会对组织资产的 呆密性、完整性或可用性产生负面影响的任何事情。请注 意,这个定义涵盖了各种事件,如直接攻击、隄风或地展等自然灾害,甚至包括意外事件, 比如有人意外切断了网络电缆。 与此相反,计算机安全事件(有时简称安全事件)通常是指由攻击导致的事件,或由用户 的恶意或蓄意行为导致的事件。","例如, RFC2350 《计算机安全事件响应要求》将安全事件和 计算机安全事件定义为\"危害计算机或网络安全的某个方面的任何不利事件\"。 美国国家标准与技术研究院(NIST)特别出版物(SP)800-61 《计算机安全事件处理指南》将 计算机安全事件定义为\"违背或即将违背计算机安全策略、可接受使用策略或标准安全实践 规范的情况\"。","NIST 相关文献,包括 SP 800-61, 读者可访问 NIST 出版物网页进行查阅。 在事件管理语境下,事件是指计算机安全事件。不过,你常会看到计算机安全事件 被简称为事件。例如,在 CISSP 的\"安全运营\"域,\"实施事件管理\"目标明确是指计算 机安全事件。 `勹;涉及的事件均指计算机安全事件。"]},{"sec":"17.2 实施检测和预防措施","body":["理想状况下,组织可通过预防措施完全避免事件的发生。然而,无论预防措施多么有效, 事件依然会发生。其他控制措施会帮助检测事件并对它们做出响应。 章对控制进行了详细论述。本节将介绍几项专门用来防止和检测安全事件的具体控 制。提醒一下,下面将描述预防性和检测性控制。 预防性控制 预防性控制(preventative control) 力求阻碍或阻止不必要或未经授权的活动 发生。","预防性控制的例子包括围栏、锁具、生物特征识别、职责分离策略、岗位轮换策略、 数据分类、访问控制方法、加密、智能卡、回呼程序、安全策略、安全意识培训、杀毒软件、 防火墙和入侵预防系统。 检测性控制 检测性控制(detective control) 力求发现或检测不必要的或未经授权的活动。 检测性控制在事件发生后运行,只有在事件发生后才能发现该活动。","检测性控制的例子包括: 保安人员、运动检测器、对闭路电视监控系统捕捉的事件进行的记录和审查、岗位轮换策略、 强制休假策略、审计踪迹、蜜罐或蜜网、入侵检测系统、违规报告、对用户的监督和审查, 以及事件调查。 你可能已经注意到\"预防性\"(preventative)和\"预防\"(preventive)这两个词都被用 到了。","虽然大多数文件目前只用\"预防\"这个词,但 CISSP 目标同时包含两种用 法。例如,域 使用\"预防控制 \"(preventive control) 的表述。本章论述的是域 的目标,而域 用了\"预防性控制 \"(preventative control) 的表述。为简单起见,在 本章中,除了直接引用 CISSP 目标的情况外,我们将只使用\"预防\"。"]},{"sec":"17.3 日志记录和监测","body":["日志记录和监测程序可帮助组织预防事件,并在有事件发生的时候做出有效响应。日志 记录机制把事件记录到各种日志中并对这些事件进行监测。通过将日志记录与监测结合起来使 用,组织可跟踪、记录和审查活动,这样就有了一个全面的问责体系。 这有助千组织检测可能会对系统的保密性、完整性或可用性产生负面影响的不良事件。","而在事件发生后开始重建系统时,日志记录还可用来识别曾经发生过的事情,有时甚至可用 来起诉事件负责人。以下几节将讨论有关日志记录和监测的几个常见主题。 #### 17.3.1 日志记录技术 日志记录(logging) 是将有关事件的信息写进日志文件或数据库的过程。日志记录捕捉事 件、变更、消息和其他描述系统上活动的数据。","日志通常会记录一些细节,比如何时、何 地、何人、发生了何事以及如何发生的。当你需要掌握最近发生事件的信息时,日志是一 个好的起点。 例如,图 17.5 显示了 Microsoft Windows 系统中的事件查看器,其中展开了一个被选中的 安全日志条目。该日志条目显示,一个名叫 Darril 的用户访问了一个名为 Payrol!Data (Confidential).xlsx 的文件,该文件位于文件夹 C:\\Payroll 中。","日志条目还表明,用户是在 <sup>21</sup> 日下午 <sup>30</sup> 分访问文件的。 只要身份识别和验证流程安全,这条日志就足以追究 il 访问文件的责任。另一方面, 如果组织没有采用安全身份认证流程,用户很容易被别人冒名顶替, Darril 可能会被错误指 控。而这强化了安全身份识别和验证流程作为问责先决条件的要求。"]},{"sec":"17.4 自动事件晌应","body":["事件响应自动化在过去几年有了显著改进,而且还在继续改进之中。以下各节将描述其 中的一些改进,如安全编排、自动化和响应(SOAR) ,人工智能(Al) 和威胁情报收集技术。 #### 17.4.1 了解 SOAR 安全编排、自动化和响应(security orchestration, automation, and response, SOAR)是指可 使组织自动响应某些事件的一组技术。","目前组织可采用各种各样的工具就潜在事件发出警报。 传统上,安全管理员要靠手动操作来响应每个警报。这通常要求管理员在核实了警告之后再 做出响应。很多时候,他们只是照搬以前的操作模式。 例如,假设有攻击者对屏蔽子网(有时也叫非军事区)中的服务器发起 SYN 洪水攻击。网 络工具检测出攻击并发出警报。组织制订的策略规定安全管理员必须验证警报是否有效。","如 果警报有效,则管理员会手动更改服务器等待 ACK 包的时间。攻击停止后,管理员再手动 把时间改回到最初的设置。 SOAR 可根据事件的不同向管理员发出警报或采取其他行动。例如,如果电子邮件服务 器的发送队列开始备份, SIEM 应用程序可以检测到问题并在享态变得严重之前向管理员发 出警报。 SOAR 允许安全管理员定义这些事件以及对事件的响应,他们通常使用剧本和运行脚本。","剧本剧本是定义了应该怎样核实事件的一份文件或检查列表。此外,剧本还提供了 响应的详细信息。 SYN 洪水攻击的剧本会列出安全管理员为核实正在发生的 SYN 洪水攻 击所应采取的相同操作。它还会列出管理员在核实了 SYN 洪水攻击后所应采取的措施。 运行脚本 运行脚本贯彻实施剧本数据,使它们成为一神自动化工具。"]}]},{"no":18,"title":"灾难恢复计划","secs":[{"sec":"18.1 灾难的本质","body":["灾难恢复计划旨在使组织正常运营中断后出现的棍乱局面恢复正常。因为性质特殊,灾 难恢复计划几乎总在人员高度紧张和头脑可能不那么冷静时执行。描述可能需要实施 DRP 的状况,如隄风破坏了主运营设施,火灾烧毁了主运营中心,恐怖行为封锁了进入城市的主 要区域。停止、阻止或中断组织执行其工作(或威胁这样做)的任何事件都被视为灾难。","一旦 IT 无法支持关键任务进程,就需要通过 DRP 来管理还原和恢复过程。 DRP 应该被设置为尽可能自动运行。 DRP 还应当被设计成在灾难期间尽可能减少决策活 动。应该对重要的人员进行培训,使他们在灾难发生时承担起相应的责任和任务并知道需要 采取的措施,从而使组织尽快恢复运营。下面首先分析可能袭击组织的灾难及其造成的特定 威胁。","很多威胁在第 章已经提过,但本章将对它们进行深入研究。 为编制针对工作场所的自然灾难和非自然灾难的恢复计划,首先必须了解灾难的各种形 式,下面将详细论述此问题。 #### 18.1.1 自然灾难 自然灾难反映了我们生存环境的恶劣之处(由千地球表面或大气变化超出人类的控制 而出现的强烈的地质和气候变化)。","对某些情况(如隄风),科学家已开发了精密的预报模型, 可在灾难发生前提供充分的警示。另一些情况(如地震),则可能在瞬间造成大面积破坏。灾 难恢复计划应提供应对这两类灾难的响应机制,该机制可以逐步组建咱应力量,也可以即 时响应突然出现的危机。 #### 1. 地震 地震由大陆板块的移动引发,全世界的任何地方都可能发生地震,而且没有预警。"]},{"sec":"18.2 理解系统韧性、高可用性和容错能力","body":["可用性是 CIA 三要素(保密性、完整性和可用性)的核心目标之一,而提升系统韧性和容 错能力的技术控制会直接影响可用性。系统韧性和容错能力的主要目标是消除关键业务系统 中的单点故障。 任何组件都可能发生单点故障(single point of failure, SPOF) ,导致整个系统无法运行。 如果计算机的单个磁盘上存有数据,那么该磁盘发生的故障会导致计算机不可用,所以磁盘 是故障发生的单点。","如果基千数据库的双站有多台 Web 服务器,但这些服务器使用同一台数 据库服务器,那么该数据库服务器就是故障发生的单点。 系统韧性(system resilience) 是指系统在遭遇不利事件时保持可接受服务水平的能力。所谓 的不利事件可能是由容错组件管理的硬件故障,也可能是由其他控制(如有效的入侵预防系统) 管理的攻击。","在某些情况下,韧性指的是系统在发生不利事件后恢复到先前状态的能力。例 如,如果容灭切换集群的主服务器出现故障,容错性将确保系统切换到另一台服务器。而系 统韧性则意味着在修复原服务器后,集群可以恢复到原先的状态。 容错能力是指系统在发生故障的情况下仍可继续运行的能力。容错能力是通过增加冗 余组件实现的,如廉价磁盘冗余阵列(RAID) 中适当配置的额外磁盘或容灾切换集群配置中 的额外服务器。","高可用性是指使用冗余技术组件,使系统能在经历短暂中断后快速从故障中恢复。高可 用性通常通过使用负载均衡和容灾切换服务器来实现。 技术人员通过系统可用时间的百分比来衡量这些控制的目标和有效性。例如,一个相当 低的可用性阔值意味着指定系统必须在 99.9 %的时间内可用(或可用性\"三个 9\") 。这相当千 在测最的任何时间段内,系统只能停机 0.1 %的时间。"]},{"sec":"18.3 恢复策略","body":["当灾难导致公司业务中断时,灾难恢复计划应该能几乎全自动起作用,并开始为恢复运 营提供支持。精心设计的灾难恢复计划应当能够实现:即使正式的 DRP 团队成员未到达现场, 第一批到达灾难现场的员工仍能有组织地立即开展恢复工作。接下来将讨论设计有效的灾难 恢复计划时所涉及的关键子任务,它们将对迅速恢复常规业务流程和重新开始主要业务地点 的活动进行指导。","除了提高响应能力外,也可通过购买保险来减轻经济损失。选择保险时,一定要购买足 够责任范围的保险,这样组织才能从灾难中恢复过来。简单的定额责任范围可能不足以包括 实际的重置成本。如果财产保险包括实际现金价值(ACV) 条款,该受损财产在受损日的公平 市场价值减去从购买之日起的累计折旧价值就是组织能够得到的补偿。","这里的关键点就是, 除非保险合同中列有重置成本的条款,否则组织可能会因遭受的任何损失而自掏腰包。许多 保险公司提供网络安全责任条款,专门列出了违反保密性、完整性和可用性的情形。 有价凭证的保险责任范围为记名的、打印的和书面的文档与手稿以及其他打印的业务记 录提供保护。不过,这种保险的责任范围并不包括钞票和纸质安全证书的损坏。","#### 18.3.1 业务单元和功能优先级 为尽可能有效地恢复业务运营,必须精心设计灾难恢复计划,从而尽早恢复优先级别最 高的业务单元。必须识别和优化重要业务功能,定义灾难或错误发生后想恢复哪些功能或以 什么样的顺序恢复。在执行此任务时,你在业务连续性工作期间所做的业务影响分析(BIA) 将是一个极好的资源。"]},{"sec":"18.4 恢复计划开发","body":["一且为组织建立业务单元优先级并获得合适的备份恢复站点的办法,就该起草实际的灾 难恢复计划了。不要指望一坐下来就能写出全部计划。在最终形成书面文档前, DRP 团队可 能要反复修改文档,以满足关键业务单元的运营需求。该计划还应考虑灾难恢复预算和可用 人员对资源、时间和费用的限制。 接下来将讨论灾难恢复计划中应该包括的重要内容。","建议根据组织的规模和参与 DRP 的人数,维护几种针对不同读者的不同类型的计划文档。下面列出一些需要考虑的文档类型: ·执行概要,提供对计划的高度概括 - .具体部门的计划 - ·针对负责实现和维护关键备份系统的 IT 技术人员的技术指南 - ·针对灾难恢复团队人员的检查 - ·为灾难恢复团队重要成员准备的完整计划副本 在灾难发生或即将来临时,务必使用特别定制的文档。","在影响组织各个部门的灾难恢复 过程中,想使自己保持头脑清醒的人员能参考他们所在部门的计划;灾难恢复团队的重要成 员有一份检查表,这份检查表在混乱环境中能指导他们的行为; IT 人员有一份技术指南,该 指南帮助他们建立和启用备用站点;最后,经理和公关人员有一份简单文档,这样,不用与 灾难恢复工作直接相关的团队成员解释,这份文档便能使他们大致了解当前的灾难恢复工作 是如何协调的。","` ::); 览专业实践图书馆,查看工作方法相关文件,并记录 BCP 过程计划及灾难恢 复计划。该领域的其他标准文件有:《BCI 最佳实践指南(GPG) 》、 ISO <sup>27001</sup> NIST SP800-34 《联邦信息系统应急计划指南》。 ### 18.4.1 应急响应 灾难恢复计划中应当包含重要人员在识别出灾难或灾难即将来临时应立即遵守的简单清 晰的指令。"]}]},{"no":19,"title":"调查和道德","secs":[{"sec":"19.1 调查","body":["信息安全专家迟早都会遇到需要调查的安全事件。很多情况下,这种调查是简短的、非 正式的确定事件,并没有严重到需要授权进一步行动或执法机构介入。然而在某些情形下, 产生的威胁或造成的破坏已经严重到需要进行更正式的调查。出现这种情形时,调查人员必 须仔细调查,确保执行正确的步骤。违背正确步骤的调查行为可能会侵犯被调查者的公民权 利,并导致诉讼失败,甚至导致调查者被起诉。","#### 19.1.1 调查的类型 安全从业人员发现他们执行的调查有各种原因。一些调查涉及执法而且必须严格遵循标 准,以提供法院可接受的证据,还有一些调查支持内部业务流程,因此要求不太严格。 #### 1. 行政调查 行政调查属千内部调查,它检查业务问题或违反组织政策的行为。它们可作为技术故障 排查工作的一部分或支持其他管理过程,如人力资源纪律程序。","运营型调查研究涉及组织的计算基础设施间题,且首要目标是解决业务问题。例如,如 IT 团队发现 Web 服务器性能有问题,就会执行旨在确定性能问题起因的调查。 `勹:周查可能迅速转变为另一种类型的调查。比如,对性能问题的调查可能发现 一些系统入侵的证据,因此行政调查可能转变为刑事调查。 运营型调查对信息收集的标准是比较宽松的。","因为它们仅针对内部业务目标,所以不倾 向千寻找证据。管理员进行运营型调查时只进行必要分析并得出他们的运营结论,而不需要 拿出特别详细且充分的调查证据,因为解决问题是首荌曰标。 除了解决运营问题,运营型调查需要进行根本原因分析,以识别运营出现问题的原因。 根本原因分析常强调需要补救的问题,以防类似事件再次发生。"]},{"sec":"19.2 计算机犯罪的主要类别","body":["攻击计算机系统的方式有很多种,动机也有很多种。信息系统安全从业人员通常将计算 机犯罪分为几类。简单来说,计算机犯罪是与计算机相关的违反法律或法规的犯罪行为。犯 罪可能针对计算机,或者在实际的犯罪活动中使用计算机。每类计算机犯罪都代表了攻击的 目的及预期结果。 违反了一个或多个安全策略的人会被认为是攻击者。","攻击者使用不同的技术达到特殊目 的。了解目标有助千分辨不同的攻击类型。需要记住的是,犯罪就是犯罪,计算机犯罪的动 机和其他类型的犯罪动机在本质上并没有差别。唯一的不同可能是攻击者进行攻击的方法有 所不同。 计算机犯罪通常分为下面几种类型: - .军事和情报攻击 - .商业攻击 - ·财务攻击 - ·恐怖攻击 - ·恶意攻击 - ·兴奋攻击 - .黑客行动主义者攻击 理解各类计算机犯罪之间的区别,对千更好地理解如何保护系统并在攻击发生时如何响 应来说是十分重要的。","攻击者留下的证据类型和数量常取决千他们的专业程度。下面将讨论 计算机犯罪的不同类型以及在攻击发生后可能找到的证据。证据有助千确定攻击者做了些什 么,以及攻击的预期目标是什么。你可能发现自己的系统只是到达真正受害者网络链条中的 一个跳板,这使得对真正攻击者的跟踪变得十分困难。 ### 19.2.1 军事和情报攻击 军事和情报攻击主要用千从执法机关或军事和技术研究机构获得秘密和受限的信息。","这 些信息的暴露可能使研究泄密、中断军事计划甚至威胁国家安全。收集军事信息或其他敏感 信息的攻击常是其他更具破坏性攻击的前兆。 攻击者可能在寻找下列信息: - ·任何类型的军事说明信息,包括部署情报、就绪情报以及战斗计划指令 - ·为军事或执法目的收集的秘密情报 - .在刑事侦查过程中获得的证据的说明和存储位置 - ·任何可能被用于后续攻击的秘密信息 由千军事和清报机构收集和使用的信息的敏感特性,他们的计算机系统常成为富有经验 的攻击者的目标。"]},{"sec":"19.3 道德规范","body":["因为安全专业人员的岗位对信任问题很敏感,所以他们对自身及相互之间负有高标准的 行为职责。管理个人行为的规则统称为道德规范。它们是指导个人日常活动的道德准则和规 则。在商业领域中,伦理描述了企业应该如何管理自己,以确保其行为是适当和公正的。商 业道德包含了广泛的主题,包括金融交易、利益冲突、非歧视和社会责任。","在网络安全领域,道德规范指导网络安全专业人员的行为,确保他们以负责任和公正的 方式行事。一些组织已经认识到需要标准的道德规范或准则,并为道德行为设计了指导原则。 本节将讨论几个道德规范。这些规范不是法律。它们是专业行为的最低标准,为你提供 了合理的道德判断基础。无论其专业领域是什么,受雇千何人,所有的安全专业人士都应遵 守这些原则。","你一定要理解并遵守本节列出的道德规范。 ### 19.3.1 组织道德规范 几乎每个组织都会向员工发布自己的道德规范,以指导他们的口常工作。这些可能以官 方道德声明的形式出现,也可能体现在组织用千开展日常业务活动的政策和程序中。 在道德规范作为单独声明发布时,它通常是高级别的,旨在提供一般指导和方向,而不 是解决具体情况。","组织道德规范可由其他政策和规则补充,这些政策和规则为具体问题提供 详细指导。 例如,美国政府有一套写入联邦法律的《政府服务道德规范》。 <sup>1980</sup> 年由国会通过,该 规范规定,任何在政府服务的人都应: - ·把对国家的忠诚置于对个人、党派或政府部门的忠诚之上。 - ·维护美国联邦及州政府的宪法、法律和法规,永远不要成为逃避责任的一方。"]},{"sec":"19.4 本章小结","body":["信息安全专业人员必须熟悉事件调查过程。这涉及收集和分析所需的证据,以便进行调 查。安全专业人员应该熟悉证据的主要类别,包括实物证据、书面证据、言辞证据和演示证 据。电子证据往往通过对硬件、软件、存储介质和网络的分析来收集。必须通过适当的程序 收集证据,不能改变原始证据,并且应当对证据链进行保护。 计算机犯罪分为几种主要的类别,每个类别中的犯罪行为有共同的动机和期望的结果。","理解攻击者所寻找的内容,对千恰当地保护系统很有帮助。 例如,军事和情报攻击用千获得秘密信息,这类信息无法通过合法的方式获得。商业攻 击的目标是民用系统,除此以外,商业攻击与军事和情报攻击相似。其他类型的攻击包括财 务攻击和恐怖攻击(在计算机犯罪中,这是一种用来中断正常生活的攻击)。还有恶意攻击和 兴奋攻击。","恶意攻击的目的是通过损毁数据或运用使组织或个人感到困窘的信息进行破坏。 兴奋攻击由缺乏经验的攻击者发起,目的是使系统受到损害或被禁用。尽管他们通常缺乏经 验,但是兴奋攻击可能会令你非常烦恼并付出高昂代价。最后,黑客行动主义者利用他们潜 在的复杂技能并将其应用到涉及其政治利益的问题上。 道德规范是指导个人行为的一组规则。","实际上,存在许多种道德规范,包括一般的和特 殊的,安全专业人员可将它们作为指导准则,(ISC)2 将道德规范作为认证的一项要求。"]}]},{"no":20,"title":"软件开发安全","secs":[{"sec":"20.1 系统开发控制概述","body":["为实现独特的业务目标,很多公司使用定制开发的软件。由于恶意的和 或粗心的开发人 员创建后门、缓冲区溢出漏洞或其他导致系统被恶意人员利用的弱点,这些定制方案可能存 在巨大的安全漏洞。 为防范这些漏洞,有必要在系统开发生命周期内引入安全控制。有组织、有条理的过程 有助千确保解决方案满足功能需求以及安全规范。","制订解决方案的信息安全专业人员应重点 关注安全性,接下来将针对这些内容对一系列系统开发行为进行讨论。 #### 20.1.1 软件开发 在系统开发的每个阶段都应当考虑安全性,软件开发阶段也不例外。程序员应该力求在 开发的应用程序中构建安全性,并为关键应用程序和处理敏感信息的应用程序提供更高的安 全级别。","给系统构建安全性往往比向现有系统中添加安全性容易得多,所以必须从软件开发 项目的初期就考虑其安全性。 #### 1. 编程语言 你可能已经知道,软件开发人员用编程语言来编写代码。但你可能不知道,同一个系统 可同时使用多种编程语言。本章简要介绍不同类型的编程语言及其安全特性。 计算机只能理解二进制代码。","计算机语言中只有 O, 而二进制代码正是这样的语言。 计算机接受的指令由一长串的二进制数字组成,这种使用二进制数字的语言被称为机器语言。 每种 CPU 芯片都有自己的机器语言,事实上,如果不借助专门软件,人们可能连最简单的机 器语言代码都无法理解。汇编语言是一种使用助记符来表示 CPU 基本指令的高级语言,但仍 然要求人们了解硬件专用的、相对晦涩的汇编指令。"]},{"sec":"20.2 安全性、用户友好性和功能性之间的关系","body":["#### 20.1.2 系统开发生命周期 如果在系统或应用程序的整个生命周期内都进行计划和管理,那么安全性是最有效的。 管理员利用项目管理使项目的开发遵循目标,并且逐步实现整个产品的目的。通常,项目管 理使用生命周期模型进行组织,以指导开发过程。使用正规化的生命周期模型,有助千确保 良好的编程实践以及在产品开发的每个阶段都嵌入安全性。","所有系统开发过程都包含一些相同的活动。虽然可能名称不尽相同,但是这些核心活动 对千开发可靠、安全的系统来说都是必不可少的。这些活动包括: - .概念定义 - ·功能需求确定 - ·控制规范的制订 - ·设计审查 - ·代码审查演练 - ·系统渊试审查 ·维护和变更管理 本章稍后的\"生命周期模型\"一节将分析两个生命周期模型,并说明如何在实际的软件 工程环境中应用这些活动。","《::;,系统开发生命周期中使用的木语在不同模型、不同出版物之司是有区别 主--- 的。不必过于担心本书或其他文献中使用的术语是否有区别。参加 CISSP 考试时, 务必深入理解处理程序如何工作以及支撑安全系统开发的基本原理。 #### 1. 概念定义 系统开发的概念定义阶段涉及为系统创建基本的概念声明。","它是由所有利益相关方(开发 人员、客户和管理人员)达成的简单声明,规定了项目用途以及系统的大体需求。概念定义是 一份非常高级的用途声明,仅有一两段话。如果阅读项目的详细总结,那么会看到摘要或简 介这种形式的概念声明,它使外行可在短时间内对项目具有高度概括性的理解。 该阶段制订的安全要求通常非常高,将在控制规范制订阶段进行完善。"]},{"sec":"20.2 创建数据库和数据仓储","body":["现在的公司几乎都有一些数据库,其中保存着对运营十分关键的信息,例如用户的联系 信息、订单跟踪数据、人力资源和福利信息或一些敏感的商业秘密。这样的数据库一般都包 含属千用户隐私的个人信息,如信用卡使用记录、旅行习惯、购物和电话记录。由千对数据 库系统的依赖程度日益增加,信息安全专业人员必须确保其具备适当的安全控制,从而确保 数据免受未授权的访问、篡改或破坏。","接下来将讨论数据库管理系统(DBMS) 的体系结构,包括不同的 DBMS 类型及特性。随 后会讨论数据库安全注意事项,包括多实例、 ODBC 、聚合、推理以及机器学习。 #### 20.2.1 数据库管理系统的体系结构 尽管目前有多种数据库管理系统(DBMS) ,但大多数系统都使用一种称为关系数据库管 理系统(RDBMS) 的技术。","因此,下面的内容主要关注关系数据库。不过,下面首先讨论两个 重要的 DBMS 体系结构:层次式数据库和分布式数据库。 #### 1. 层次式数据库和分布式数据库 层次式数据模型将关联的记录和字段组合为一个逻辑树结构。这会形成一个\"一对多\" 的数据模型,其中的节点可能没有子节点,也可能有一个或多个子节点,但每个节点都只有 一个父节点。","图 20.9 展示了一个层次式数据模型示例。 ![](_page_803_Figure_5.jpeg) 20.9 层次式数据模型 20.9 中的层次式数据模型是一家公司的组织结构图。注意,这个示例属千\"一对多\" 数据模型。每名员工有一名直属上司,但一名管理者可有一名或多名下属。层次式数据模型 的其他示例包括 NCAA March Mac:lness bracket 系统以及在互联网上使用的域名系统(DNS) 记录的层次化分布。"]},{"sec":"20.3 存储器威胁","body":["数据库管理系统加强了数据的力量,并且获得了对可以访问数据的人员和可以对数据执 行的操作所进行的控制。然而,安全专业人员必须记住, DBMS 安全性只适用于追过传统的 \"前门\"来访问信息的渠道。此外,数据在处理时还会经过计锌机的存储资源(内存和物理介 质),为了确保这些埜本资源免受安全漏洞的威胁,必须采取预防措施。","毕竟,我们永远都不 会将大量的时间和金钱仅仅花在保护前门上而令后门大开。 章介绍了不同类型的存储。下面看一下数据存储系统面临的两个主要威胁。第一种 威胁是无论正在使用哪类存储,都存在对存储资源的非法访问。如果管理员不实施恰当的文 件系统访问控制,那么入侵者可能通过浏览文件系统发现敏感数据。在更敏感的环境中,管 理员还应当防止绕过操作系统控制直接访问物理存储介质以检索数据的攻击行为。","最好的办 法是使用加密文件系统,该系统只有通过主操作系统才可访问。此外,在多级安全性环境中 运作的系统应当提供充分的控制来确保对共享内存和存储器资源设置适当的控制,从而使某 个分类级别的数据对千较低分类级别的用户来说是不可读的。 `勹~t 算环境中,存储访问扣制的错误变得特别危险,其中一个错误配置就可能 公开 Web 上的敏感信息。","如果组织利用云存储系统,如 Amazon 的简单存储服务 (S3) ,则应该特别注意设置强的默认安全设置,限制公共访问,并仔细监视任何 允许公共访问的策略变更. 隐蔽通道攻击是数据存储资源面临的第二种主要威胁。隐蔽存储通道准许通过直接或间 接地操纵共享存储介质,在两个分类级别之间传输敏感数据。这可能很简单,就像不经意间 向共享的内存或物理存储器的一部分写入敏感数据一样。"]}]},{"no":21,"title":"恶意代码和应用攻击","secs":[{"sec":"21.1 恶意软件","body":["恶意软件包括广泛的软件威胁,这些威胁利用网络、操作系统、软件和物理安全漏洞对 计算机系统散播恶意载荷。某些恶意代码对象(如计算机病毒和特洛伊木马)依靠用户对计算 机的不知情或不当使用在系统间传播。其他一些恶意代码对象(如蠕虫)则依靠自身的力量在 脆弱的系统间迅速传播。 计算机安全从业人员必须熟悉各种恶意代码带来的风险,这样才能采取适当的对策来保 护所关注的系统并在系统受到破坏时做出适当响应。","` :::研究世界上已存在的各类恶意代码之前,必须认识到它们之间的区别是非常 模糊的。同一个恶意软件可能同时具有不同类别的特征,因此很难把它归到某一确 切的分类中。 #### 21.1.1 恶意代码的来源 恶意代码从哪里来?在早期,恶意代码的编写者都是相当有经验(可能误入歧途)的软件 开发人员,他们会为自己精心构思的、富有创意的恶意代码技术感到骄傲。","事实上,他们揭 露了流行软件包和操作系统中的安全漏洞,从而提高了人们对计算机的安全意识,这确实起 到了一些有益的作用。对干这类代码编写者,本章后面补充的 \"RTM 与互联网蠕虫\"部分提 供了示例。 如今这个时代出现了一些脚本小子,他们并不理解安全漏洞的内在机理,只会从网上下 载现成的软件(或脚本程序),并利用这些软件对远程系统进行攻击。","这种趋势也导致了一种 新的病毒制造软件的出现,即使是只掌握极少技术知识的人,也可以利用它制作病毒并使其 在互联网上传播。这反映在到现在为止反病毒专家们已记录的大量病毒上。这些业余的恶意 代码开发人员常常只是尝试他们下载的工具,或者试图给一两个对手制造麻烦。遗憾的是, 这些恶意代码有时会快速传播,并且给一般互联网用户带来麻烦。"]},{"sec":"21.2 恶意软件预防","body":["网络安全专业人员必须采取措施帮助其组织抵御各种恶意软件威胁。正如你在本章前几 节中所读到的,这些威胁有多种形式,为了防御它们,需要多管齐下。 #### 21.2.1 易受恶意软件攻击的平台 大多数计算机病毒都是为了在运行世界上最流行的操作系统(Microsoft Windows) 的计算 机上执行破坏活动而设计的。","在 <sup>2020</sup> av-test 的分析中,研究人员估计,大约有 <sup>83</sup> %的恶 意软件是针对 Windows 平台的。这与过去几年相比是一个重大变化,当时 95%以上的恶意软 件都是针对 Wmdows 系统的;它反映了恶意软件开发的一个变化,更多的移动设备和其他平 台成为恶意软件的目标。","值得注意的是, Mac 系统上的恶意软件数量最近增加了三倍,而针对 Android 设备的恶 意软件变体数量在同一年翻了一番。底线是所有操作系统的用户都应该意识到恶意软件的威 胁,并确保他们有足够的防护措施。 #### 21.2.2 反恶意软件 反恶意软件现在是每个网络安全计划的基石。有些系统管理员甚至不考虑部署那些没有 安装基本反恶意软件的端点(如台式机、笔记本电脑或移动设备)或服务器。","这类软件旨在阻止 现今环境中常见的绝大多数威胁。不这样做就像开车时不系安全带一样:既不安全又不负责任。 这些软件包中的绝大多数都会使用被称为基千特征的检测方法来识别系统上潜在的病毒 感染。本质上,防病毒软件维护一个包含所有已知病毒特征的超大数据库。根据防病毒软件 包的配置设置,它会定期扫描存储介质,检查其中是否有包含符合这些条件的数据的文件。"]},{"sec":"21.3 应用程序攻击","body":["在第 <sup>20</sup> 章中,你认识到在开发操作系统和应用程序时使用可靠的软件工程过程的重要 性。在下面几节,你将学习一些具体技术,攻击者可使用这些技术来利用编码过程中由于疏 忽大意而留下的漏洞。 ### 21.3.1 缓冲区溢出 当开发人员没有正确验证用户的输入以确保用户输入适当大小的内容时,就会存在缓冲 区溢出漏洞。","输入太多而\"溢出\"原有的缓冲区,就会覆盖内存中相邻的其他数据。例如, 如果一个 Web 表单有一个域与后端的变量关联,该变量仅允许输入 <sup>10</sup> 个字符,但表单的处 理器没有验证输入的长度,那么操作系统可能简单地将数据写入留给该变量的空间,这可能 危及存储在内存中的其他数据。在最糟的情况下,该数据可用来覆盖系统指令,使攻击者能 利用缓冲区溢出漏洞在服务器上执行目标指令。","当编写软件时,开发人员必须特别关注允许用户输入的变噩。许多编程语言不对变最的 长度强制实施固有的限制,这就要求编程人员对代码进行边界检查。许多编程人员认为参数 检查是一种不必要的、会减缓程序开发进度的负担,因此这成了程序开发的一个固有漏洞。 安全从业人员有责任确保开发人员意识到由缓冲区溢出漏洞引发的风险,并且应当采取适当 措施来帮助编程人员开发的代码抵御这类攻击。","只要允许用户输入变量,编程人员就应当采取满足下列各项条件的措施。 ·用户输入的值的长度不能超过存放它的缓冲区的大小(例如,将一个具有 <sup>10</sup> 个字母的 单词输入最多可容纳 个字母的字符串变量中)。 - .用户不能向保存输入值的变虽类型输入无效的值(例如,将一个字母输入一个数字型 变量中)。"]},{"sec":"21.4 注入漏洞","body":["注入漏洞是攻击者用来突破 Web 应用程序并访问该应用程序所在系统的主要机制之一。 这些漏洞允许攻击者向 Web 应用程序提交某种类型的代码作为输入,并诱使 Web 服务器执 行该代码或将其提供给其他服务器执行。 存在多种潜在的注入攻击。通常,注入攻击以其所利用的后端系统类型或向目标交付(注 入)的有效负载类型命名。","例如 SQL 注入、轻量级目录访问协议(LDAP) XML 注入、命令 注入、 HTML 注入、代码注入和文件注入。 #### <sup>21</sup> 4.1 SQL 注入攻击 Web 应用程序通常会接收来自用户的输入并将其组合成一个数据库查询语句,最后把查 询结果返回用户。例如,考虑电子商务网站上的搜索功能。","如果用户在搜索框中输入 orange tiger pillows(橙色老虎枕头), Web 服务器需要知道商品目录中哪些产品可能与此搜索词匹配。 它可能向后端数据库服务器发送如下请求: SELECT ernNarne, ItemDescription, ItemPrice WHERE ItemNarne LIKE'%orange%'AND ItemName LIKE' tiger%'AND ItemName LIKE' pillow 枭' 此命令检索一个项目列表,该列表可包含在返回给最终用户的结果中。","在 SQL 注入攻击 中,攻击者可能会向 Web 服务器发送不寻常的请求,可能会搜索以下内容: orange tiger pillow'; SELECT CustomerName, CreditCardNumber FROM Orders; - - 如果 Web 服务器简单地将此请求传给数据库服务器,它将执行如下操作(为便千查看, 稍微重新格式化): SELECT 工七 emName, ItemDescrip ion, 工七 emPrice WHERE ItemName LIKE'%orange 'AND 工七 emName LIKE '%tiger%' AND emName LIKE'%pillow'; SELECT CustomerName, CreditCardNumber FROM Orders; 此命令如果成功,将运行两个不同的 SQL 查询(以分号分隔)。"]}]}];var S={
  examDate:'2027-02-28',        // 默认考试日期（可改）
  materials:JSON.parse(JSON.stringify(DEFAULT_MATERIALS)),
  habits:{},                    // 'date' -> {cissp:bool, ai:bool, minutes:num}

  logs:[],                      // {date, type:'cissp'|'ai', minutes, note}

  guideCheck:{version:'OSG 第10版（2024考试大纲）',lastCheck:null},
  quizCount:0,                  // 章节测验完成次数

  records:{},                   // 学习记录：date -> [{minutes,ch,ts}]（进度引擎输入）

};

function seed(){
  for(var d=0;d<5;d++){var dt=addDays(PLAN_START,d);S.habits[dt]={cissp:true,ai:false,minutes:30}}
  S.habits[PLAN_START]={cissp:true,ai:true,minutes:45};
  S.habits[addDays(PLAN_START,2)]={cissp:true,ai:true,minutes:60};
  // 昨天(8/8) 的 CISSP 任务没完成 → 逾期示例
  S.examHistory=[];   // 模考记录初始为空：只有完成完整 100 题答卷才计入一次模考
  S.logs=[
   {date:addDays(PLAN_START,0),type:'ai',minutes:30,note:'CISSP 导学 + AI 安全攻击面笔记'},

var CH_TO_LESSON=[2,3,19,4,5,8,9,7,6,10,12,11,14,16,17,19,19,20,19,22,23];

/* 阶段定义（按教材 8 域分 8 阶段，每章 3 个学习日 × 30 分钟） */
var PHASES_V5=[
 {name:'安全与风险管理',chs:[1,2,3,4],start:'2026-08-03',per:3},
 {name:'资产安全 · 架构与工程',chs:[5,6,7,8,9],start:'2026-08-19',per:3},

/* ---- 用户级学习计划（v22：开始日期/每日时长按用户隔离） ---- */
function userStartDate(){ return (S.startDate||addDays(TODAY,1)); }
function userDailyMin(){ var m=parseInt(S.dailyMin,10); return (m>=10&&m<=240)?m:30; }
function phaseStartDate(pi){
  var d=userStartDate();
  for(var i=0;i<pi;i++){var ph=PHASES_V5[i];d=addDays(d,Math.max(1,(ph.chs.length||0)*(ph.per||1)))}
  return d;
}
function chPhase(ch){for(var i=0;i<PHASES_V5.length;i++)if(PHASES_V5[i].chs.indexOf(ch)>-1)return i;return 0}
function phaseLearnedMin(pi){
  var ph=PHASES_V5[pi];var m=0;
  for(var k in S.records){
    var recs=S.records[k];if(!(recs instanceof Array))continue;
    if(k>=phaseStartDate(pi)&&k<=TODAY)recs.forEach(function(r){m+=r.minutes});
  }
  return m;
}
function last7Avg(){
  var sum=0;
  for(var i=0;i<7;i++){var d=addDays(TODAY,-i);var recs=S.records[d];if(recs&&(recs instanceof Array))recs.forEach(function(r){sum+=r.minutes})}
  return Math.round(sum/7*10)/10;
}
function phaseProgress(pi){
  var ph=PHASES_V5[pi];
  // 冲刺模考阶段：进度 = 完整模考次数 / 15（完成 15 次完整 100 题模考才算完成）
  if(ph.name==='冲刺模考'||!ph.chs.length){
    var examN=S.examHistory.filter(function(x){return x.type==='exam'}).length;
    var need=15;
    var pct2=Math.min(100,Math.round(examN/need*100));
    var startDay7=phaseStartDate(pi);
    var estF7=(TODAY<startDay7)?startDay7:addDays(TODAY,Math.max(0,need-examN));
    var delay7=(TODAY<startDay7)?0:daysBetween(startDay7,estF7);
    return {pct:pct2,learned:examN,needMin:need,planFinish:startDay7,estFinish:estF7,delay:delay7,risk:(TODAY<startDay7)?'ok':(need-examN>4?'high':(need-examN>2?'mid':'ok')),remain:Math.max(0,need-examN),rate:1,examMode:true};
  }
  var needMin=ph.chs.length*ph.per*userDailyMin();
  var learned=phaseLearnedMin(pi);
  var pct=needMin?Math.min(100,Math.round(learned/needMin*100)):100;
  var planFinish=addDays(phaseStartDate(pi),Math.ceil(needMin/userDailyMin())-1);
  var remain=Math.max(0,needMin-learned);
  var rate=Math.max(last7Avg(),userDailyMin());
  var startDay=phaseStartDate(pi);
  var estFinish,delay,risk;
  if(TODAY<startDay){ // 阶段尚未开始：按计划显示，不提前不延期
    estFinish=planFinish;delay=0;risk='ok';
  }else{
    estFinish=addDays(TODAY,Math.ceil(remain/rate));
    delay=daysBetween(planFinish,estFinish);
    risk=delay>4?'high':(delay>2?'mid':'ok');
  }
  return {pct:pct,learned:learned,needMin:needMin,planFinish:planFinish,estFinish:estFinish,delay:delay,risk:risk,remain:remain,rate:rate};
}
function currentPhaseInfo(){
  for(var i=0;i<PHASES_V5.length;i++){var p=phaseProgress(i);if(p.pct<100)return {pi:i,ph:PHASES_V5[i],p:p}}
  return {pi:PHASES_V5.length-1,ph:PHASES_V5[PHASES_V5.length-1],p:phaseProgress(PHASES_V5.length-1)};
}

function smoothScroll(el,to,dur){
  var start=el.scrollTop||0;var t0=null;
  function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
  function step(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/dur);el.scrollTop=Math.round(start+(to-start)*ease(p));if(p<1)requestAnimationFrame(step)}
  requestAnimationFrame(step);
}

function stats(){
  var totalDays=0,aiDays=0,totalMin=0,streak=0,weekDone=S.weekDone.length;
  for(var k in S.habits){var h=S.habits[k];if(h.cissp||h.ai){totalDays++;if(h.ai)aiDays++;totalMin+=(h.minutes||0)}}
  // 连续打卡（从今天往回数）
  var d=TODAY;
  for(var i=0;i<400;i++){var h=S.habits[d];if(h&&(h.cissp||h.ai)){streak++;d=addDays(d,-1)}else break}
  // v22：学习进度总览按用户实际学习量计算（不再按时间流逝显示进度）
  var planPct=(function(){var _n=0,_l=0;try{for(var _i=0;_i<PHASES_V5.length;_i++){var _p=phaseProgress(_i);_n+=_p.needMin;_l+=Math.min(_p.needMin,_p.learned)}}catch(e){}return _n?Math.round(_l/_n*100):0})();
  // AI 技能平均
  var sum=0,cnt=0;
  for(var c=0;c<SKILL_TREE.length;c++)for(var s=0;s<SKILL_TREE[c].skills.length;s++){sum+=skillLevel(c,s);cnt++}
  var aiPct=Math.round(sum/cnt/5*100);
  var dLeft=daysBetween(TODAY,S.examDate);
  var lessonPct=Math.round(lessonDoneCount()/TOTAL_WEEKS*100);
  return {totalDays:totalDays,aiDays:aiDays,totalMin:totalMin,streak:streak,planPct:planPct,aiPct:aiPct,dLeft:dLeft,weekDone:weekDone,lessonPct:lessonPct};
}

function stat(label,val,unit,color,icn,sub){
  var map={green:['var(--green-l)','var(--green-d)'],amber:['var(--amber-l)','var(--amber)'],blue:['var(--blue-l)','var(--blue)'],purple:['var(--purple-l)','var(--purple)'],red:['var(--red-l)','var(--red)']};
  var c=map[color]||map.green;
  return '<div class="stat"><div class="s-label">'+label+'</div>'+
    '<div class="s-val">'+val+'<small> '+unit+'</small></div>'+
    '<div class="s-ic" style="background:'+c[0]+';color:'+c[1]+'">'+icn+'</div></div>';
}
function ringHTML(pct,color,label){
  var r=48,c=2*Math.PI*r;
  var off=c*(1-pct/100);
  return '<div style="text-align:center"><div class="score-ring" style="width:110px;height:110px">'+
    '<svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="48" fill="none" stroke="#E8EDE2" stroke-width="11"/>'+
    '<circle cx="55" cy="55" r="48" fill="none" stroke="'+color+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 55 55)" style="transition:stroke-dashoffset .6s"/></svg>'+
    '<div class="sval" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><b style="font-size:22px">'+pct+'%</b><span style="font-size:10.5px">'+label+'</span></div></div></div>';
}
function heatmapHTML(){
  // 最近 8 周（含本周），周一起始
  var endW=weekOf(TODAY);
  var startW=Math.max(0,endW-7);
  var cells='',weeks='';
  for(var w=startW;w<=endW;w++){
    var wStart=addDays(PLAN_START,w*7);
    weeks+='<span title="'+wStart+' 起">'+parseInt(wStart.slice(5,7),10)+'/'+parseInt(wStart.slice(8,10),10)+'</span>';
    for(var d=0;d<7;d++){
      var dt=addDays(PLAN_START,w*7+d);
      var h=S.habits[dt];
      var lv=0;
      if(h){var n=(h.cissp?1:0)+(h.ai?1:0);lv=Math.min(4,Math.ceil((h.minutes||0)/20)+(h.cissp&&h.ai?1:0))}
      var cls='h-cell'+(lv>0?' l'+lv:'')+(dt===TODAY?' today':'');
      var tip=fmtCN(dt)+' · '+(h?(h.minutes||0)+' 分钟'+(h.cissp?' · CISSP':'')+(h.ai?' · AI':''):'未打卡（点击补卡）');
      cells+='<div class="'+cls+'" title="'+tip+'" onclick="catchUpDay(\''+dt+'\')"></div>';
    }
  }
  // 统计：累计打卡 / 最长连续 / 本周打卡 / 章节完成
  var totalDays=0,streak=0,thisWeek=0;
  for(var k in S.habits){var hh=S.habits[k];if(hh&&(hh.cissp||hh.ai))totalDays++}
  var cur=TODAY;
  while(S.habits[cur]&&(S.habits[cur].cissp||S.habits[cur].ai)){streak++;cur=addDays(cur,-1)}
  var cw=weekOf(TODAY);
  for(var dd=0;dd<7;dd++){var dtw=addDays(PLAN_START,cw*7+dd);var hw=S.habits[dtw];if(hw&&(hw.cissp||hw.ai))thisWeek++}
  return '<div class="heat-stats">'+
    '<div class="hs"><b>'+totalDays+'</b><span>累计打卡</span></div>'+
    '<div class="hs"><b>'+streak+'</b><span>连续打卡</span></div>'+
    '<div class="hs"><b>'+thisWeek+'</b><span>本周打卡</span></div>'+
    '<div class="hs"><b>'+Object.keys(S.lessonDone).length+'</b><span>已学章节</span></div>'+
    '<div class="hs"><b>'+(S.quizCount||0)+'</b><span>章节测验</span></div>'+
    '<div class="hs"><b>'+S.examHistory.filter(function(x){return x.type==='exam'}).length+'</b><span>完整模考</span></div>'+
    '</div>'+
    '<div class="heat-days"><span class="hd-ph"></span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>'+
    '<div class="heat-wrap"><div class="heat">'+cells+'</div></div>'+
    '<div class="heat-weeks"><span class="hd-ph"></span>'+weeks+'</div>';
}
function catchUpDay(dt){
  if(dt>=TODAY)return;
  var h=S.habits[dt];
  if(h&&(h.cissp||h.ai)){toast(fmtCN(dt)+' 已打卡 '+((h.minutes||0))+' 分钟');return}
  if(!h)S.habits[dt]={cissp:false,ai:false,minutes:0};
  S.habits[dt].cissp=true;S.habits[dt].minutes+=userDailyMin();
  S.logs.unshift({date:TODAY,type:'cissp',minutes:userDailyMin(),note:'补打卡 '+fmtCN(dt)});
  save();toast('已补打卡 '+fmtCN(dt)+' ✓');renderAll();
}
