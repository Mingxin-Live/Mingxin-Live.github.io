function importKBFile(ev){
  var f=ev.target.files[0];if(!f)return;
  var reader=new FileReader();
  reader.onload=function(){
    var txt=reader.result;
    // 教材正文 JSON（cissp-chapters.json 结构）
    if(f.name.indexOf('.json')>-1||/^\{[\s\S]*"chapters"/.test(txt.trim().slice(0,200))){
      try{
        var d=JSON.parse(txt);
        if(d&&d.chapters&&d.chapters[0]&&d.chapters[0].secs){
          S.chapterData=d;save();
          toast('教材正文已加载：'+d.chapters.length+' 章 ✓');
          if(edState.w>=0)openLesson(edState.w);
          renderAll();return;
        }
      }catch(e){toast('JSON 解析失败');return}
    }
    var count=0;
    var re=/^#{1,3}\s+(.+)$/gm;var m;
    while((m=re.exec(txt))&&count<200){
      var title=m[1].replace(/[#*`]/g,'').trim();
      if(!Array.isArray(S.kbExtra))S.kbExtra=[];
  if(title.length>0&&title.length<60){S.kbExtra.push({id:'loc'+Date.now()+count,title:title,type:'本地文件',tag:'local',src:f.name,learned:false,ref:null});count++}
    }
    if(!count)S.kbExtra.push({id:'loc'+Date.now(),title:f.name+'（未识别标题，已存文件引用）',type:'本地文件',tag:'local',src:f.name,learned:false,ref:null});
    save();toast('已导入 '+count+' 条知识索引 ✓');renderAI();
  };
  reader.readAsText(f);ev.target.value='';
}

var mdToc=[];   // 渲染时收集标题目录 {lv,text,id}
function mdToHtml(src){
  if(!src)return '';
  mdToc=[];
  var lines=String(src).split(/\r?\n/);
  var html='',inCode=false,codeBuf=[],inList=false,tableBuf=[],chkCount=0;
  function escS(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function inline(s){
    s=escS(s);
    s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s=s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<span class="md-img-wrap"><button class="md-img-rep" title="替换图片">↻</button><button class="md-img-del" title="删除图片">✕</button><img class="md-img" src="$2" alt="$1" loading="lazy"></span>');
    s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
    s=s.replace(/__([^_]+)__/g,'<b>$1</b>');
    s=s.replace(/\*([^*]+)\*/g,'<i>$1</i>');
    s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<span class="md-link-wrap"><button class="md-link-edit" title="编辑链接">✎</button><button class="md-link-del" title="删除链接">✕</button><a href="$2" target="_blank" rel="noopener">$1</a></span>');
    return s;
  }
  function tableHTML(buf){
    var rows=buf.map(function(r){return r.replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim()})});
    rows=rows.filter(function(r){return !(r.length>=1&&r.every(function(c){return /^:?-+:?$/.test(c)}))});
    if(!rows.length)return '';
    function cell(c){var t=inline(c);return t||'&nbsp;';}
    var h='<table class="md-table"><thead><tr>'+rows[0].map(function(c){return '<th>'+cell(c)+'</th>'}).join('')+'</tr></thead><tbody>';
    for(var i=1;i<rows.length;i++)h+='<tr>'+rows[i].map(function(c){return '<td>'+cell(c)+'</td>'}).join('')+'</tr>';
    return '<div class="md-tbl-wrap"><button class="md-tbl-handle" title="修改表格行列">⤢</button><button class="md-tbl-del" title="删除表格">✕</button>'+h+'</tbody></table></div>';
  }
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(/^```/.test(l)){if(inCode){html+='<pre class="md-code"><code>'+codeBuf.join('\n')+'</code></pre>';codeBuf=[];inCode=false}else inCode=true;continue}
    if(inCode){codeBuf.push(escS(l));continue}
    if(/^\|/.test(l)){tableBuf.push(l);continue}
    if(tableBuf.length){html+=tableHTML(tableBuf);tableBuf=[]}
    var cm=l.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.+)/);
    if(cm){html+='<div class="md-chk'+(cm[1]!==' '?' done':'')+'">'+(cm[1]!==' '?'☑ ':'☐ ')+inline(cm[2])+'</div>';continue}
    var hm=l.match(/^(#{1,4})\s+(.+)/);
    var hEmpty=l.match(/^(#{1,4})\s+$/);
    if(hm||hEmpty){var lv=(hm||hEmpty)[1].length;var tid='mdh'+(mdToc.length+1);html+='<h'+(lv+1)+' id="'+tid+'" class="md-h md-h'+lv+'">'+(hm?inline(hm[2]):'<br>')+'</h'+(lv+1)+'>';if(hm)mdToc.push({lv:lv+1,text:hm[2].replace(/\*\*|__|\*|`/g,''),id:tid});continue}
    if(/^>\s?/.test(l)){html+='<blockquote class="md-quote">'+inline(l.replace(/^>\s?/,''))+'</blockquote>';continue}
    var lm=l.match(/^\s*[-*]\s+(.+)/);
    if(lm){if(!inList){html+='<ul class="md-list">';inList=true}html+='<li>'+inline(lm[1])+'</li>';continue}
    if(inList){html+='</ul>';inList=false}
    if(/^---+\s*$/.test(l)){html+='<hr class="md-hr">';continue}
    if(!l.trim()){html+='<p class="md-blank"><br></p>';continue}
    html+='<p class="md-p">'+inline(l)+'</p>';
  }
  if(inCode)html+='<pre class="md-code"><code>'+codeBuf.join('\n')+'</code></pre>';
  if(inList)html+='</ul>';
  if(tableBuf.length)html+=tableHTML(tableBuf);
  return html;
}

/* ============ 链接转笔记：HTML → Markdown ============ */
function compressImageFile(file,maxW,cb){
  if(!file||!cb)return;
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      try{
        var w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        var cv=document.createElement('canvas');cv.width=w;cv.height=h;
        var ctx=cv.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        cb(cv.toDataURL('image/jpeg',0.82));
      }catch(e){cb(rd.result);}
    };
    img.onerror=function(){cb(rd.result);};
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}
function htmlToMd(html,baseUrl){
  if(!html)return '';
  var d=document.createElement('div');
  d.innerHTML=String(html);
  d.querySelectorAll('script,style,noscript,nav,footer,header,aside,form,button,iframe,svg,.ad,.ads,.advert,.advertisement,.adsbygoogle,figure>figcaption,.nav,.menu,.breadcrumb,.pagination,.share,.comment').forEach(function(e){e.remove()});
  var out=[];
  function abs(u){if(!u)return'';try{return new URL(u,baseUrl).href}catch(e){return u}}
  function txt(n){return (n.textContent||'').replace(/\s+/g,' ').trim()}
  function inline(el){
    var s='';
    Array.prototype.forEach.call(el.childNodes,function(n){
      if(n.nodeType===3){s+=(n.textContent||'').replace(/\s+/g,' ');return;}
      if(n.nodeType!==1)return;
      var t=n.tagName.toLowerCase();
      if(t==='br'){s+='\n';return;}
      if(t==='img'){var src=n.getAttribute('src')||n.getAttribute('data-src')||n.getAttribute('data-original')||'';if(src){var al=n.getAttribute('alt')||'';s+='!['+al+']('+abs(src)+')';}return;}
      if(t==='a'){var ht=n.getAttribute('href')||'';var at=txt(n);s+='['+at+']('+abs(ht)+')';return;}
      if(t==='strong'||t==='b'){var tt=txt(n);if(tt)s+='**'+tt+'**';return;}
      if(t==='em'||t==='i'){var tt2=txt(n);if(tt2)s+='*'+tt2+'*';return;}
      if(t==='code'){s+='`'+txt(n)+'`';return;}
      s+=inline(n);
    });
    return s;
  }
  var skipH1=true; // 跳过页面主标题（笔记标题已含），避免重复
  function walk(el){
    Array.prototype.forEach.call(el.children,function(child){
      var t=child.tagName.toLowerCase();
      if(t==='h1'||t==='h2'||t==='h3'||t==='h4'||t==='h5'||t==='h6'){var tx=inline(child).trim();if(tx){if(t==='h1'&&skipH1){skipH1=false;return;}out.push('');out.push(new Array(parseInt(t[1])).join('#')+' '+tx);out.push('');}return;}
      if(t==='p'){
        var tx2=inline(child).trim();
        // 伪标题：整段仅一个粗体且文本短（很多文章的章节标题用 <p><strong>xx</strong></p>）
        var sb=child.querySelector&&child.querySelector('strong,b');
        var isFake=sb&&child.children.length===1&&!child.querySelector('img,a,br')&&tx2.length>=2&&tx2.length<=60;
        if(isFake){out.push('');out.push('## '+tx2.replace(/\*\*/g,''));out.push('');}
        else if(tx2)out.push(tx2);
        return;
      }
      if(t==='ul'||t==='ol'){Array.prototype.forEach.call(child.children,function(li){var tx3=inline(li).replace(/\n/g,' ').trim();if(tx3)out.push('- '+tx3);});return;}
      if(t==='blockquote'){var bq=inline(child).split('\n').map(function(x){return x.trim()?('> '+x.trim()):'>'}).join('\n');if(bq.replace(/>/g,'').trim())out.push(bq);return;}
      if(t==='table'){
        var trs=child.querySelectorAll('tr');if(!trs.length)return;
        var md=[];var colCnt=0;
        Array.prototype.forEach.call(trs,function(tr){
          var cells=Array.prototype.map.call(tr.children,function(c){return inline(c).replace(/\n/g,' ').trim()});
          if(cells.length>colCnt)colCnt=cells.length;
          md.push('| '+cells.join(' | ')+' |');
        });
        if(md.length){
          var sep='| '+Array(Math.max(1,colCnt)).fill('---').join(' | ')+' |';
          out.push('');out.push(md[0]);out.push(sep);
          if(md.length>1)out.push(md.slice(1).join('\n'));
          out.push('');
        }
        return;
      }
      if(t==='pre'){var cc=txt(child);if(cc)out.push('```\n'+cc+'\n```');return;}
      if(t==='hr'){out.push('---');return;}
      if(t==='img'){var s2=child.getAttribute('src')||child.getAttribute('data-src')||'';if(s2)out.push('![]('+abs(s2)+')');return;}
      if(t==='div'||t==='section'||t==='article'||t==='main'||t==='body'||t==='figure'||t==='span'||t==='li'){walk(child);return;}
      var hasBlock=child.children&&Array.prototype.some.call(child.children,function(c){return ['P','H1','H2','H3','H4','H5','H6','DIV','TABLE','UL','OL','BLOCKQUOTE','PRE','SECTION','ARTICLE'].indexOf(c.tagName)>=0});
      if(hasBlock){walk(child);}
      else{var tx4=inline(child).trim();if(tx4)out.push(tx4);}
    });
  }
  walk(d);
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}

/* HTML → MD（所见即所得同步，基础版） */
function noteHtmlToMd(html){
  var d=document.createElement('div');d.innerHTML=html;
  var out=[];
  function txt(node){return (node.textContent||'').replace(/\u00a0/g,' ')}
  function inline(block){
    var s=block.innerHTML;
    s=s.replace(/<b><\/b>|<strong><\/strong>/g,'');
    s=s.replace(/<b>(.*?)<\/b>/g,'**$1**');
    s=s.replace(/<strong>(.*?)<\/strong>/g,'**$1**');
    s=s.replace(/<i>(.*?)<\/i>/g,'*$1*');
    s=s.replace(/<em>(.*?)<\/em>/g,'*$1*');
    s=s.replace(/<code>(.*?)<\/code>/g,'`$1`');
    s=s.replace(/<a href="([^"]+)"[^>]*>(.*?)<\/a>/g,'[$2]($1)');
    s=s.replace(/<img[^>]*src="([^"]+)"[^>]*>/g,'![]($1)');
    s=s.replace(/<br\s*\/?>/g,'\n');
    s=s.replace(/<[^>]+>/g,'');
    return s.replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
  }
  function tableToMd(t){
    var trs=t.querySelectorAll('tr');if(!trs.length)return '';
    var rows=[];
    for(var i=0;i<trs.length;i++){
      rows.push('| '+Array.prototype.map.call(trs[i].children,function(c){return inline(c)}).join(' | ')+' |');
    }
    var sep='| '+Array.prototype.map.call(trs[0].children,function(){return '---'}).join(' | ')+' |';
    return [rows[0],sep].concat(rows.slice(1)).join('\n');
  }
  function blockLines(el){
    // 将块内内容转成行数组：br / 块边界 = 换行，空内容产生空行
    var lines=[],cur='';
    function flush(){lines.push(cur);cur='';}
    function walk(node){
      if(node.nodeType===3){cur+=(node.textContent||'').replace(/\u00a0/g,' ');return;}
      if(node.nodeType!==1)return;
      var tag=node.tagName.toLowerCase();
      if(tag==='button'){return;}
      if(tag==='br'){flush();return;}
      if(tag==='img'){cur+='![]('+(node.getAttribute('src')||'')+')';return;}
      if(tag==='a'){cur+='['+txt(node)+']('+(node.getAttribute('href')||'')+')';return;}
      if(tag==='strong'||tag==='b'){cur+='**'+txt(node)+'**';return;}
      if(tag==='em'||tag==='i'){cur+='*'+txt(node)+'*';return;}
      if(tag==='code'){cur+='`'+txt(node)+'`';return;}
      Array.prototype.forEach.call(node.childNodes,walk);
    }
    Array.prototype.forEach.call(el.childNodes,walk);
    flush();
    return lines;
  }
  function walkBlocks(el){
    var kids=[];
    Array.prototype.forEach.call(el.childNodes,function(node){kids.push(node);});
    Array.prototype.forEach.call(kids,function(child){
      if(child.nodeType===3){var tt=(child.textContent||'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();if(tt)out.push(tt);return;}
      if(child.nodeType!==1)return;
      var tag=child.tagName.toLowerCase();
      if(tag==='h1'||tag==='h2'||tag==='h3'||tag==='h4'||tag==='h5'){out.push(new Array(Math.max(2,parseInt(tag[1]))).join('#')+' '+inline(child).replace(/\s+$/,''));}
      else if(tag==='ul'||tag==='ol'){Array.prototype.forEach.call(child.children,function(li){out.push('- '+inline(li));});}
      else if(tag==='blockquote'){out.push('> '+inline(child).replace(/\n/g,'\n> '));}
      else if(tag==='pre'){out.push('```\n'+txt(child).replace(/\n+$/,'')+'\n```');}
      else if(tag==='table'){var tm=tableToMd(child);if(tm)out.push(tm);}
      else if(tag==='hr'){out.push('---');}
      else if(tag==='img'){out.push('![]('+(child.getAttribute('src')||'')+')');}
      else if(tag==='button'){/* 忽略表格/图片手柄按钮 */}
      else if(tag==='div'||tag==='p'){
        if(child.classList.contains('md-chk')){out.push((child.classList.contains('done')?'- [x] ':'- [ ] ')+inline(child).replace(/^[☐☑]\s*/,''));}
        else if(child.querySelector&&(child.querySelector('.md-table')||child.querySelector('.md-tbl-wrap'))){
          walkBlocks(child);
        }
        else{
          var ls=blockLines(child);
          if(!ls.length){out.push('');}
          else{for(var i=0;i<ls.length;i++)out.push(ls[i]);}
        }
      }
      else if(child.childNodes.length){walkBlocks(child);}
    });
  }
  walkBlocks(d);
  return out.join('\n').replace(/\n{3,}/g,'\n\n');
}
/* 插入工具 */
function noteInsTable(id){
  var inp=prompt('表格尺寸（行 × 列），如 3×4：','3×3');
  if(!inp)return;

  if(!mm){toast('格式应为：行×列，如 3×4');return;}
  var rows=parseInt(mm[1],10),cols=parseInt(mm[2],10);
  if(rows<1||cols<1||rows>60||cols>20){toast('行数 1-60，列数 1-20');return;}
  var cells=[],i;
  for(i=0;i<cols;i++)cells.push(' ');
  var h='| '+cells.join(' | ')+' |\n';
  h+='| '+Array(cols).fill('---').join(' | ')+' |\n';
  for(var r=1;r<rows;r++)h+='| '+cells.join(' | ')+' |\n';
  noteInsMd(id,'\n'+h+'\n');
}

function noteInsMd(id,md){
  var ta=document.getElementById('nedTa');

  var pv=document.getElementById('nedPrev');
  if(pv&&pv.contentEditable==='true'){
    var sel=window.getSelection();
    if(sel.rangeCount){
      var range=sel.getRangeAt(0);
      // WYSIWYG：\n 会被浏览器折叠，必须按行构建块级元素插入
      var frag=document.createDocumentFragment();
      var lines=String(md).split('\n');
      for(var i=0;i<lines.length;i++){
        var d=document.createElement('div');
        if(lines[i]===''){d.innerHTML='<br>';}
        else{d.textContent=lines[i];}
        frag.appendChild(d);
      }
      range.deleteContents();
      var last=frag.lastChild;
      range.insertNode(frag);
      // 手动同步渲染（不依赖 InputEvent，兼容移动端）
      ta.value=noteHtmlToMd(pv.innerHTML);
      pv.innerHTML=mdToHtml(ta.value);

      if(n2&&mask2)noteApplyTheme(mask2,noteTheme(n2.theme||'spring'),n2.bg);
      var r2=document.createRange();r2.selectNodeContents(pv);r2.collapse(false);

    else{ta.style.display='none';pv.style.display='';pv.contentEditable='true';pv.focus();var r=document.createRange();r.selectNodeContents(pv);r.collapse(false);var s=window.getSelection();s.removeAllRanges();s.addRange(r);}

  ta.addEventListener('input',upd);

        // 顶层文本节点（正在输入的新行）：重渲染后该位置成为块，按其在 childNodes 的索引定位

        else{
          for(var k4=pv.childNodes.length-1;k4>=0;k4--){if(pv.childNodes[k4].nodeType===1){top=pv.childNodes[k4];break;}}

  // 表格内删除保护：Backspace/Delete 只删单元格内容，不删表格
  pv.addEventListener('keydown',function(e){

            var div=document.createElement('div');div.innerHTML='<br>';
            var range=sel.getRangeAt(0);range.deleteContents();range.insertNode(div);

    if(e.key!=='Backspace'&&e.key!=='Delete')return;
    if(!sel.rangeCount||!sel.isCollapsed)return;
    var node=sel.anchorNode;
    var el=node&&node.nodeType===1?node:(node&&node.parentElement);
    if(el&&el.closest&&el.closest('.md-table')){
      e.preventDefault();
      var r=sel.getRangeAt(0);
      if(e.key==='Backspace'){if(r.startOffset>0&&r.startContainer.nodeType===3)r.startContainer.deleteData(r.startOffset-1,1);}
      else{if(r.startContainer.nodeType===3&&r.startOffset<r.startContainer.length)r.startContainer.deleteData(r.startOffset,1);}
      ta.value=noteHtmlToMd(pv.innerHTML);
    }
  });
  // 事件委托：表格手柄 / 图片替换 / 图片放大
  pv.addEventListener('click',function(e){
    var t=e.target;
    if(t&&t.closest){
      var h=t.closest('.md-tbl-handle');
      if(h){e.preventDefault();e.stopPropagation();noteResizeTable(h.closest('.md-tbl-wrap'));return;}
      var rp=t.closest('.md-img-rep');
      if(rp){e.preventDefault();e.stopPropagation();noteReplaceImg(rp.closest('.md-img-wrap'));return;}
      var le=t.closest('.md-link-edit');
      if(le){e.preventDefault();e.stopPropagation();noteEditLink(le.closest('.md-link-wrap'));return;}
      var ld=t.closest('.md-link-del');
      if(ld){e.preventDefault();e.stopPropagation();noteDelEl(ld.closest('.md-link-wrap'),'链接');return;}
      var td2=t.closest('.md-tbl-del');
      if(td2){e.preventDefault();e.stopPropagation();noteDelEl(td2.closest('.md-tbl-wrap'),'表格');return;}
      var id2=t.closest('.md-img-del');
      if(id2){e.preventDefault();e.stopPropagation();noteDelEl(id2.closest('.md-img-wrap'),'图片');return;}
    }
  });
  pv.addEventListener('dblclick',function(e){
    var t=e.target;
    if(t&&t.closest){
      var img=t.closest('.md-img');
      if(img){e.preventDefault();noteZoomImg(img);}
    }
  });
  document.getElementById('nedInsImg').onclick=function(){document.getElementById('nedFile').click();};
  document.getElementById('nedFile').addEventListener('change',function(){
    var f=this.files&&this.files[0];if(!f)return;
    compressImageFile(f,1400,function(d){noteInsMd(n.id,'\n![]('+d+')\n');});
    this.value='';
  });
  document.getElementById('nedBgBtn').onclick=function(){document.getElementById('nedBgFile').click();};
  document.getElementById('nedBgFile').addEventListener('change',function(){
    var f=this.files&&this.files[0];if(!f)return;
    compressImageFile(f,1600,function(d){n.bg=d;applyTheme();toast('已应用自定义背景（可在 🎨 面板清除）');});
    this.value='';
  });
  document.getElementById('nedInsTable').onclick=function(){noteInsTable(n.id);};
  document.getElementById('nedInsLink').onclick=function(){noteInsLink(n.id);};
  ta.addEventListener('paste',function(e){
    var items=e.clipboardData&&e.clipboardData.items;
    for(var i=0;i<(items?items.length:0);i++){
      if(items[i].type&&items[i].type.indexOf('image')===0){
        e.preventDefault();
        var f=items[i].getAsFile();
        compressImageFile(f,1400,function(d){insertAtCursor(ta,'\n![]('+d+')\n');upd();});
        toast('图片已内嵌到笔记');
        return;
      }
    }
  });
  document.getElementById('nedBack').onclick=function(){if(confirm('未保存的修改会丢失，确定返回？')){m.remove();renderNotes();}};
  document.getElementById('nedSave').onclick=function(){
    n.title=(document.getElementById('nedTitle').value||'').trim()||'未命名笔记';
    n.content=ta.value;n.updated=TODAY;
    save();toast('笔记已保存 ✓');m.remove();renderNotes();
  };
  noteProg(pv,m.querySelector('.ned-side'));
  upd();
  // 默认进入上次使用的编辑模式（localStorage 记忆），未设置时用分栏
  var savedMode='';try{savedMode=localStorage.getItem('wb_note_mode')||'';}catch(e){}
  if(savedMode==='wys'||savedMode==='prev')setMode(savedMode);
  else ta.focus();

function notePickTheme(id,th){
  var n=S.notes.filter(function(x){return x.id===id})[0];if(!n)return;

function viewNote(id){
  var n=S.notes.filter(function(x){return x.id===id})[0];if(!n)return;
  var th=noteTheme(n.theme||'spring');
  var m=document.createElement('div');

    '<div class="nv-top" style="background:linear-gradient(120deg,'+th.accent2+',#1F5E3C 55%,'+th.accent+')">'+

function publishNote(id){

  S.posts.unshift({id:'p'+Date.now(),title:n.title,slug:slugify(n.title),tags:n.tags,category:'未分类',status:'draft',content:n.content,created:TODAY,updated:TODAY});

function init(){
  // 数据迁移与清洗：模考记录只保留完整模考（type==='exam'），清除旧版 quiz/无 type 演示数据；缺失字段兜底（防旧数据渲染崩溃）
  try{
    if(S.examHistory&&Array.isArray(S.examHistory))S.examHistory=S.examHistory.filter(function(x){return x&&x.type==='exam'});
    if(!S.quizHistory||!Array.isArray(S.quizHistory))S.quizHistory=[];
    if(!S.wrongSet||typeof S.wrongSet!=='object')S.wrongSet={};
    if(!S.reviews||typeof S.reviews!=='object')S.reviews={};
    if(!S.habits||typeof S.habits!=='object')S.habits={};
    if(!S.logs||!Array.isArray(S.logs))S.logs=[];
    if(!S.records||typeof S.records!=='object')S.records={};
    if(!S.usedPool||typeof S.usedPool!=='object')S.usedPool={};
    if(!S.guideCheck||typeof S.guideCheck!=='object')S.guideCheck={version:'未核查',lastCheck:null};
    if(!S.examDate)S.examDate=addDays(TODAY,196);
    if(typeof S.quizCount!=='number')S.quizCount=0;
    if(typeof S.points!=='number')S.points=0;
    if(!Array.isArray(S.achievements))S.achievements=[];
    if(!S.aiCardsDone||typeof S.aiCardsDone!=='object')S.aiCardsDone={};
    if(!S.lessonDone||typeof S.lessonDone!=='object')S.lessonDone={};
  }catch(e){}
  // FAB 图标内容
  if(S.darkMode)document.body.classList.add('dark');
  var bt=document.getElementById('backTop');
  if(bt)bt.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg><span>TOP</span>';
  var tf=document.getElementById('tocFab');
  if(tf)tf.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>';
  // 教材正文自动加载（部署场景；file:// 失败可手动导入；成功仅刷新学习页避免全量重建闪烁）
  try{
    fetch('data/cissp-chapters.json').then(function(r){return r.json()}).then(function(d){
      if(d&&d.chapters&&d.chapters.length){
        S.chapterData=d;save();
        toast('教材正文已加载：'+d.chapters.length+' 章 ✓');
        if(edState.w>=0)openLesson(edState.w);
        else{renderHero();renderCissp();renderAI();}
      }
    }).catch(function(){});
  }catch(e){}
  // 30 条数据提醒备份
  try{
    var d=JSON.parse(localStorage.getItem(KEY)||'{}');
    var cnt=(d.logs?d.logs.length:0)+(d.examHistory?d.examHistory.length:0)+(d.jobs?d.jobs.length:0);
    if(cnt>=30)toast('数据已积累 '+cnt+' 条，建议导出备份');
  }catch(e){}
  // 阅读面板由 Unified Reading Engine 单独绑定 RAF 滚动处理；
  // 不再挂载历史 compact 监听器，避免同一帧相互改写 Header 状态。
  renderAll();
}
// 点击遮罩关闭
$('#mask').addEventListener('click',function(e){if(e.target===this)closeMask()});
init();

  /* ---- 账户到期提醒（≤30 天：顶部横幅 5 秒 + 不再提醒勾选） ---- */
  function checkExpireWarn() {
    try {
      var u = window.wbUser || {};
      if (!u.email || u.isAdmin) return;            // admin 永久，不提醒
      var ex = u.expireAt;
      if (!ex) return;
      var dLeft = Math.ceil((new Date(ex).getTime() - Date.now()) / 86400000);
      if (dLeft <= 0 || dLeft > 30) return;
      var key = 'wb_expire_warn_off_' + u.email;
      try { if (localStorage.getItem(key) === '1') return; } catch (e) {}
      var bar = document.createElement('div');
      bar.id = 'wbExpWarn';
      bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:linear-gradient(120deg,#B03A2E,#C0392B);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:14px;font-size:13px;font-family:system-ui,sans-serif;box-shadow:0 4px 18px rgba(192,57,43,.35);flex-wrap:wrap';
      bar.innerHTML = '<span>⚠️ 账户有效期即将到期（剩 ' + dLeft + ' 天），到期后将无法登录，如有需要请联系管理员延期</span>' +
        '<label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;white-space:nowrap;color:#FFE9E9"><input type="checkbox" id="wbExpWarnChk" style="accent-color:#fff">不再提醒</label>';
      document.body.appendChild(bar);
      var el = bar.querySelector('#wbExpWarnChk');
      if (el) el.onchange = function () { try { localStorage.setItem(key, el.checked ? '1' : '0'); } catch (e) {} };
      setTimeout(function () {
        try { bar.style.transition = 'opacity .6s'; bar.style.opacity = '0'; } catch (e) {}
        setTimeout(function () { try { bar.remove(); } catch (e) {} }, 650);
      }, 5000);
    } catch (e) {}
  }

    m.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(10,28,18,.6);display:flex;align-items:center;justify-content:center;padding:20px;font-family:system-ui,sans-serif';

      '<div style="font-size:16px;font-weight:800;color:#C0392B;margin-bottom:6px">⛔ 停用账户</div>' +
      '<div style="font-size:12.5px;color:#5B6B60;line-height:1.7;margin-bottom:18px">停用后该用户将<b style="color:#C0392B">无法再登录</b>（有效期设为昨天）。如需恢复，可对其再次「延期」。</div>' +
      '<button id="wbAdmDisBtn" style="width:100%;padding:11px;border:none;border-radius:11px;background:linear-gradient(120deg,#C0392B,#E05D4C);color:#fff;font-size:14px;font-weight:800;cursor:pointer">确认停用</button>' +
      '<div style="text-align:center;margin-top:10px"><span id="wbAdmDisCancel" style="font-size:12px;color:#88978C;cursor:pointer">取消</span></div></div>';
    document.body.appendChild(m);
    m.querySelector('#wbAdmDisCancel').onclick = function () { m.remove(); };
    m.querySelector('#wbAdmDisBtn').onclick = function () {
      var btn = m.querySelector('#wbAdmDisBtn'); btn.disabled = true; btn.textContent = '停用中…';
      if (String(uid).indexOf('local_') === 0) {
        // 内置试用用户：写入 localStorage 覆盖表（仅本机生效）
        window.wbLocalSet(String(uid).slice(6), { expireAt: new Date(Date.now() - 86400000).toISOString() });
        btn.textContent = '✅ 已停用';
        setTimeout(function () { m.remove(); loadAdminUsers(listEl); }, 800);
        return;
      }
      api('/api/admin/disable', 'POST', { userId: uid }, getToken()).then(function (r) {
        if (r.ok) { btn.textContent = '✅ 已停用'; setTimeout(function () { m.remove(); loadAdminUsers(listEl); }, 800); }
        else { btn.textContent = '确认停用'; btn.disabled = false; alert(r.msg || '停用失败'); }
      });
    };
  }
  /* 批量停用（勾选多人，统一停用） */
  function openBatchDisable(m) {
    var ids = getSelectedUsers(m);
    if (!ids.length) { admMsg(m, '请先勾选要停用的用户（管理员除外）', true); return; }
    var mm = document.createElement('div');
    mm.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(10,28,18,.6);display:flex;align-items:center;justify-content:center;padding:20px;font-family:system-ui,sans-serif';
    mm.innerHTML = '<div style="background:#fff;border-radius:18px;max-width:400px;width:100%;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.4)">' +
      '<div style="font-size:16px;font-weight:800;color:#C0392B;margin-bottom:6px">⛔ 批量停用账户</div>' +
      '<div style="font-size:12.5px;color:#5B6B60;line-height:1.7;margin-bottom:18px">将为 <b style="color:#C0392B">' + ids.length + '</b> 个用户设置停用，停用后<b style="color:#C0392B">无法再登录</b>（有效期设为昨天）。如需恢复，可对其「延期」。</div>' +
      '<button id="wbBDisBtn" style="width:100%;padding:11px;border:none;border-radius:11px;background:linear-gradient(120deg,#C0392B,#E05D4C);color:#fff;font-size:14px;font-weight:800;cursor:pointer">确认停用 ' + ids.length + ' 个用户</button>' +
      '<div style="text-align:center;margin-top:10px"><span id="wbBDisCancel" style="font-size:12px;color:#88978C;cursor:pointer">取消</span></div></div>';
    document.body.appendChild(mm);
    mm.querySelector('#wbBDisCancel').onclick = function () { mm.remove(); };
    mm.querySelector('#wbBDisBtn').onclick = function () {
      var btn = mm.querySelector('#wbBDisBtn'); btn.disabled = true; btn.textContent = '停用中…';
      var jobs = ids.map(function (id) {
        if (String(id).indexOf('local_') === 0) {
          var lu = window.wbLocalFind(String(id).slice(6));
          if (!lu) return Promise.resolve(false);
          window.wbLocalSet(lu.username, { expireAt: new Date(Date.now() - 86400000).toISOString() });
          return Promise.resolve(true);
        }
        return api('/api/admin/disable', 'POST', { userId: id }, getToken()).then(function (r) { return r.ok; }).catch(function () { return false; });
      });
      Promise.all(jobs).then(function (results) {
        var okN = results.filter(function (x) { return x; }).length;
        alert('✅ 已停用 ' + okN + ' / ' + ids.length + ' 个用户');
        mm.remove(); loadAdminUsers(m);
      });
    };
  }
})();


</script>
